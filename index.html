<meta name="theme-color" content="#FBF1E6">
<title>Instagram Ad Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF1E6;--card:#FFF8F1;--ink:#3A3532;--mut:#857A70;--line:#F0DFCF;--acc:#E8705A;--prik:#2B1912;--pri:#B8431F;--soft:#FCE0D2;--mint:#D3E5DA;--sun:#F9E6B0;--sky:#D3E0EE;--ok:#3F8A6A;--bad:#C4552F;--warnbg:#FBEBC4;--warnk:#5A3E00;
--sh:7px 7px 16px rgba(190,150,120,.28),-5px -5px 12px rgba(255,255,255,.95);--shs:4px 4px 10px rgba(190,150,120,.25),-3px -3px 8px rgba(255,255,255,.9);--shi:inset 3px 3px 8px rgba(190,150,120,.22),inset -3px -3px 8px rgba(255,255,255,.95);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241F1C;--card:#2E2825;--ink:#F4EAE0;--mut:#B3A59A;--line:#40373A;--acc:#F08A72;--prik:#2B1912;--pri:#FFAE97;--soft:#4A332B;--mint:#2F4339;--sun:#4D4220;--sky:#2D3C4D;--ok:#7FD0A8;--bad:#FF9B78;--warnbg:#4A3A12;--warnk:#FFE3A3;--sh:6px 6px 14px rgba(0,0,0,.4),-4px -4px 10px rgba(255,255,255,.04);--shs:4px 4px 9px rgba(0,0,0,.35),-3px -3px 7px rgba(255,255,255,.04);--shi:inset 3px 3px 7px rgba(0,0,0,.4),inset -3px -3px 7px rgba(255,255,255,.04)}}
:root[data-theme="dark"]{--bg:#241F1C;--card:#2E2825;--ink:#F4EAE0;--mut:#B3A59A;--line:#40373A;--acc:#F08A72;--prik:#2B1912;--pri:#FFAE97;--soft:#4A332B;--mint:#2F4339;--sun:#4D4220;--sky:#2D3C4D;--ok:#7FD0A8;--bad:#FF9B78;--warnbg:#4A3A12;--warnk:#FFE3A3;--sh:6px 6px 14px rgba(0,0,0,.4),-4px -4px 10px rgba(255,255,255,.04);--shs:4px 4px 9px rgba(0,0,0,.35),-3px -3px 7px rgba(255,255,255,.04);--shi:inset 3px 3px 7px rgba(0,0,0,.4),inset -3px -3px 7px rgba(255,255,255,.04)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Nunito","Noto Sans Malayalam","Noto Sans Devanagari","Noto Sans Tamil",system-ui,sans-serif}
.app{max-width:1080px;margin:0 auto;padding:16px 16px 64px}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.005em}
h1{font-size:30px;line-height:1.15;margin:0 0 6px}
h2{font-size:21px;line-height:1.25;margin:0 0 6px}
h3{font-size:16px;margin:0 0 4px}
h4{font-size:14px;margin:16px 0 4px}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--pri);margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 12px;font-size:15px}

.langs{display:flex;gap:6px;padding:5px;background:var(--bg);border-radius:999px;box-shadow:var(--shi);margin-top:14px}
.langs button{flex:1;padding:9px 4px;border:0;border-radius:999px;background:transparent;color:var(--mut);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;min-height:44px}
.langs button[aria-pressed="true"]{background:var(--acc);color:var(--prik);box-shadow:var(--shs)}
.card{background:var(--card);border-radius:28px;padding:22px 20px;margin:18px 0 0;box-shadow:var(--sh)}
#qc{background:var(--mint)}
label.f{display:block;font-weight:700;font-size:14px;margin:18px 0 8px}
input[type=text],input[type=number],select{width:100%;min-height:48px;padding:10px 16px;font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:18px;box-shadow:var(--shi)}
input[type=file]{width:100%;padding:14px;border:2px dashed var(--mut);border-radius:18px;background:var(--card);color:var(--ink);font:inherit}
:is(input,select,button,a):focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips label{margin:0;position:relative}
.chips input{position:absolute;opacity:0;width:0;height:0}
.chips span{display:block;padding:10px 18px;border-radius:999px;background:var(--card);cursor:pointer;font-size:15px;font-weight:600;box-shadow:var(--shs)}
.chips input:checked+span{background:var(--acc);color:var(--prik);font-weight:800}
.chips input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
.go{width:100%;min-height:54px;margin-top:22px;padding:12px;font-family:inherit;font-size:17px;font-weight:800;background:var(--acc);color:var(--prik);border:0;border-radius:999px;cursor:pointer;box-shadow:var(--sh)}
.go:disabled{opacity:.6}
.btn{min-height:44px;padding:10px 20px;border:0;border-radius:999px;background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;box-shadow:var(--shs)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hide{display:none}
#plan{background:transparent;box-shadow:none;padding:6px 0}
.sec{padding:16px 18px;margin:14px 0;border-radius:24px;background:var(--card);box-shadow:var(--sh)}
.sec:nth-of-type(4n+1){background:var(--mint)}.sec:nth-of-type(4n+2){background:var(--soft)}.sec:nth-of-type(4n+3){background:var(--sun)}.sec:nth-of-type(4n+4){background:var(--sky)}
.sec p,.sec ul,.sec ol{margin:4px 0;font-size:15px}.sec ul,.sec ol{padding-left:20px}
.big{background:var(--sun);border-radius:24px;padding:16px 18px;margin:14px 0;font-size:15px;box-shadow:var(--sh)}
.big b{font-size:30px;font-weight:800;color:var(--pri)}
.warn{background:var(--warnbg);color:var(--warnk);padding:12px 14px;border-radius:18px;margin:10px 0;font-size:14px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:18px;padding:12px 14px;font:inherit;font-size:15px;margin:6px 0;box-shadow:var(--shi)}
.pv{display:flex;gap:8px;margin:10px 0;overflow-x:auto}.pv img{height:84px;border-radius:14px;box-shadow:var(--shs)}
.score{display:flex;gap:12px;margin:14px 0}.score>div{flex:1;border-radius:22px;padding:14px;font-size:14px;color:var(--mut);background:var(--card);box-shadow:var(--shs)}
.score b{font-size:38px;font-weight:800;display:block;color:var(--ink);line-height:1.15}.score .up b{color:var(--ok)}
.bw{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:4px 0 10px;box-shadow:var(--shi)}.bw i{display:block;height:100%;background:var(--mut);border-radius:6px}.bw.up i{background:var(--ok)}
.small{font-size:13px;color:var(--mut)}
.pos li::marker{color:var(--ok)}.neg li::marker{color:var(--bad)}
.kv{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv li{border-radius:22px;padding:12px 14px;font-size:15px;font-weight:800;box-shadow:var(--shs);background:var(--mint)}
.kv li:nth-child(4n+2){background:var(--soft)}.kv li:nth-child(4n+3){background:var(--sun)}.kv li:nth-child(4n+4){background:var(--sky)}
.kv b{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:2px}
.sec ul.ck{list-style:none;padding-left:0}.sec ul.ck li{margin:6px 0}
.sec .tl{list-style:none;padding-left:0}.tl li{display:flex;gap:10px;margin:10px 0}
.dy{flex:none;min-width:70px;text-align:center;background:var(--card);color:var(--pri);font-weight:800;font-size:13px;border-radius:999px;padding:3px 8px;height:fit-content;box-shadow:var(--shs)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.ba img{width:100%;border-radius:18px;box-shadow:var(--shs)}
.tips{background:var(--sun);border-radius:22px;padding:14px 16px;margin:12px 0;font-size:14px;box-shadow:var(--shs)}.tips ul{margin:6px 0 0;padding-left:18px}.tips li{margin:4px 0}
.opts{display:grid;gap:12px}.opts label{position:relative;margin:0}
.opts input{position:absolute;opacity:0;width:0;height:0}
.opts span{display:block;padding:14px 16px;border-radius:22px;background:var(--card);cursor:pointer;box-shadow:var(--shs)}
.opts b{display:block;font-size:15px}.opts em{display:block;font-style:normal;font-size:13px;color:var(--mut);margin-top:2px;line-height:1.45}
.opts input:checked+span{background:var(--soft);box-shadow:var(--shi),inset 0 0 0 2px var(--acc)}
.opts input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
.vid{position:relative;padding-top:56.25%;margin:6px 0}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:18px}
.sec a{color:var(--pri);font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.top h1{font-size:24px;margin:0}.top .langs{margin:0;min-width:260px;flex:1;max-width:340px}
.layout{display:block}
.side{display:block;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-bottom:6px}
.side .av,.side .hi,.side #helpS{display:none}
.side nav{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.side nav a{flex:none;padding:9px 16px;border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;box-shadow:var(--shs)}
.side nav a.on{background:var(--acc);color:var(--prik)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);margin-top:6px}
.hero h2{font-size:24px}.hero .go{display:inline-flex;width:auto;margin-top:10px;padding:10px 22px;min-height:46px;font-size:15px;text-decoration:none;align-items:center}
.plant{width:92px;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 0}
.st{border-radius:24px;padding:14px 16px;background:var(--mint);box-shadow:var(--sh)}.st:nth-child(2){background:var(--soft)}.st:nth-child(3){background:var(--sun)}.st:nth-child(4){background:var(--sky)}
.st span{display:block;font-size:12px;font-weight:700;color:var(--mut);line-height:1.3}.st b{display:block;font-size:26px;font-weight:800;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr;gap:0}
.card h3{font-size:16px;margin:0 0 10px}
.bars{display:flex;gap:6px;align-items:flex-end}.bc{flex:1;text-align:center;min-width:0}.bt{height:110px;display:flex;align-items:flex-end;background:var(--bg);border-radius:12px;box-shadow:var(--shi);overflow:hidden}.bt i{display:block;width:100%;border-radius:10px 10px 0 0}
.bc span{display:block;font-size:10px;color:var(--mut);margin-top:4px;line-height:1.2;overflow-wrap:anywhere}.bc b{font-size:12px}
.don{display:flex;align-items:center;gap:14px}.don svg{width:110px;flex:none;transform:rotate(-90deg)}.don ul{list-style:none;margin:0;padding:0;font-size:13px}.don li{margin:4px 0}.don li i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.empty{font-size:14px;color:var(--mut);margin:0}
.rc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0}.rc+.rc{border-top:1px solid var(--line)}.rc b{display:block;font-size:15px}.rc small{color:var(--mut);font-size:12px}
.tr{display:flex;flex-wrap:wrap;gap:6px}.tr span{background:var(--sun);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700}
.help{background:var(--sun);border-radius:24px;padding:16px;box-shadow:var(--shs)}.help b{display:block;font-size:15px}.help p{margin:4px 0 10px;font-size:13px;color:var(--mut)}.help .go{display:inline-flex;width:auto;margin:0;padding:8px 18px;min-height:40px;font-size:14px;text-decoration:none;align-items:center}
.mobonly{margin-top:18px}.mobonly:empty{display:none}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr 1fr;gap:16px}.plant{width:130px}}
@media (min-width:900px){.layout{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
.side{top:16px;background:var(--mint);border-radius:30px;padding:22px 18px;box-shadow:var(--sh);margin:0}
.side .av{display:flex;width:72px;height:72px;border-radius:50%;background:var(--card);align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 6px;box-shadow:var(--shs)}
.side .hi{display:block;text-align:center;font-weight:800;margin:0 0 16px}
.side nav{display:block;overflow:visible;padding:0}.side nav a{display:block;margin:8px 0;border-radius:18px;padding:12px 16px;background:transparent;box-shadow:none}.side nav a.on{background:var(--card);box-shadow:var(--shs);color:var(--ink)}
.side #helpS{display:block;margin-top:20px}.mobonly{display:none}}
html{scroll-behavior:smooth}

#sp{position:fixed;top:0;left:0;height:4px;width:100%;background:var(--acc);transform-origin:left;transform:scaleX(0);z-index:50}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wgrow{from{width:0}}
@keyframes donut{from{transform:rotate(-220deg) scale(.55);opacity:0}to{transform:rotate(-90deg) scale(1);opacity:1}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes pop{40%{transform:scale(1.14)}}
@keyframes shim{to{background-position:-200% 0}}
.top{animation:up .6s both}.hero{animation:up .7s .08s both}
.st{animation:up .6s both}.st:nth-child(2){animation-delay:.08s}.st:nth-child(3){animation-delay:.16s}.st:nth-child(4){animation-delay:.24s}
.lf{animation:fade .4s both}
.bt i{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}.bc:nth-child(2) .bt i{animation-delay:.06s}.bc:nth-child(3) .bt i{animation-delay:.12s}.bc:nth-child(4) .bt i{animation-delay:.18s}.bc:nth-child(5) .bt i{animation-delay:.24s}.bc:nth-child(6) .bt i{animation-delay:.3s}
.bw i{animation:wgrow .9s cubic-bezier(.2,.8,.2,1) both}
.don svg{animation:donut 1s cubic-bezier(.2,.8,.2,1) both}
.plant path:nth-of-type(n+3){transform-box:view-box;transform-origin:60px 88px;animation:sway 3.6s ease-in-out infinite alternate}.plant path:nth-of-type(4){animation-delay:-1.2s}.plant path:nth-of-type(5){animation-delay:-2.4s}
.pop{animation:pop .4s}
.skel{height:14px;border-radius:8px;margin:8px 0;background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}.skel.s2{width:60%}
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}.js .rv.in{opacity:1;transform:none}
.go,.btn,.chips span,.opts span,.side nav a,.langs button{transition:transform .18s ease,box-shadow .18s ease,background .25s ease,color .25s ease}
.go:active,.btn:active,.chips span:active,.opts span:active,.side nav a:active{transform:scale(.96)}
@media (hover:hover){.go:hover,.btn:hover{transform:translateY(-2px);box-shadow:10px 10px 20px rgba(190,150,120,.32),-5px -5px 12px rgba(255,255,255,.95)}.chips span:hover,.opts span:hover{transform:translateY(-2px)}.st,.sec{transition:transform .25s}.st:hover,.sec:hover{transform:translateY(-3px)}}
.cmp{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shs);margin:8px 0;line-height:0}.cmp img{width:100%;display:block}
.cmp .bf{position:absolute;inset:0;height:100%;object-fit:cover;clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp::after{content:"";position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.35);pointer-events:none}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}.cmp:focus-within{outline:3px solid var(--pri)}
.tg{position:absolute;top:10px;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1.4;z-index:1}.tg.l{left:10px}.tg.r{right:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}}
.mascot{width:108px;height:108px;border-radius:30px;object-fit:cover;flex:none;box-shadow:var(--sh);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.tagl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--pri);margin:0 0 4px}
.side .av img,.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.how ol{display:flex;gap:10px;flex-wrap:wrap;list-style:none;padding:0;margin:0;counter-reset:s}
.how li{counter-increment:s;background:var(--bg);box-shadow:var(--shi);border-radius:999px;padding:8px 16px 8px 10px;font-weight:700;font-size:14px;display:flex;align-items:center}
.how li::before{content:counter(s);display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--prik);align-items:center;justify-content:center;margin-right:8px;font-size:13px;font-weight:800}
@media (min-width:700px){.mascot{width:176px;height:176px}}
</style>
</head>

s7:"Ads Manager-ൽ ഘട്ടം ഘട്ടമായി സെറ്റ് ചെയ്യാം",l7:["Facebook Page ഉണ്ടാക്കുക, Instagram 'Professional' അക്കൗണ്ടാക്കി ആ Page-മായി ബന്ധിപ്പിക്കുക.","Instagram-ൽ റീലോ ഫോട്ടോയോ പോസ്റ്റ് ചെയ്ത് Boost അമർത്തുക, അല്ലെങ്കിൽ business.facebook.com → Ads Manager → Create.","മുകളിലെ ലക്ഷ്യം തിരഞ്ഞെടുക്കുക.","ഓഡിയൻസ് സെറ്റ് ചെയ്യുക: സ്ഥലം, പ്രായം, താൽപ്പര്യങ്ങൾ.","Placements തിരഞ്ഞെടുക്കുക.","ദിവസ ബജറ്റ് ₹{bud}, {days} ദിവസം കഴിഞ്ഞ് അവസാന തീയതി നൽകുക.","നിങ്ങളുടെ പോസ്റ്റ് പരസ്യമായി തിരഞ്ഞെടുത്ത് ബട്ടൺ {cta} ആക്കുക.","പേയ്‌മെന്റ് രീതി (UPI അല്ലെങ്കിൽ കാർഡ്) ചേർത്ത് Publish അമർത്തുക."],s7n:"പരസ്യം റിവ്യൂ ചെയ്യാൻ ഒരു ദിവസം വരെ എടുക്കാം.",
s8:"3–4 ദിവസത്തിന് ശേഷം എന്ത് ചെയ്യണം",l8:["ആദ്യ 2 ദിവസം ഒന്നും മാറ്റരുത്. Meta ഇപ്പോഴും പഠിക്കുകയാണ്.","മെസ്സേജുകളോ ഫലങ്ങളോ വരുന്നുണ്ടെങ്കിൽ ബജറ്റ് ഏകദേശം 20% കൂട്ടുക.","ആളുകൾ പരസ്യം കാണുന്നുണ്ട് പക്ഷേ ക്ലിക്കോ മെസ്സേജോ ഇല്ലെങ്കിൽ വീഡിയോയുടെ ആദ്യ 3 സെക്കൻഡോ ബട്ടണോ മാറ്റുക.","ആരും കാണുന്നില്ലെങ്കിൽ സ്ഥലമോ പ്രായപരിധിയോ വിശാലമാക്കുക, അല്ലെങ്കിൽ ബജറ്റ് കൂട്ടുക.","ഒരു സമയം ഒരു കാര്യം മാത്രം മാറ്റുക."],
sp:"പരസ്യത്തിന്റെ പണം എങ്ങനെ അടയ്ക്കും",lp:["പരസ്യച്ചെലവ് Meta-ക്ക് നൽകുന്നത് പരസ്യം ചെയ്യുന്ന ആളുടെ സ്വന്തം പേയ്‌മെന്റ് രീതിയിലൂടെയാണ്: UPI, കാർഡ് അല്ലെങ്കിൽ നെറ്റ് ബാങ്കിംഗ് (അക്കൗണ്ട് അനുസരിച്ച്).","പരസ്യം ഓടുന്നതിനനുസരിച്ച് മാത്രമേ പണം പോകൂ. അവസാന തീയതി നൽകിയാൽ ₹{total} ആണ് പരമാവധി.","അക്കൗണ്ട് പ്രീപെയ്ഡ് (ആദ്യം പണം ചേർക്കണം) അല്ലെങ്കിൽ പോസ്റ്റ്പെയ്ഡ് (പിന്നീട് ബിൽ) ആകാം. പേയ്‌മെന്റ് രീതി ചേർക്കുന്നത് വരെ പരസ്യം ഓടില്ല.","ബില്ലിൽ GST കൂടി ചേർന്നേക്കാം, പരസ്യ ബജറ്റിന് പുറമെയുള്ള ചെലവായി കണക്കാക്കുക.","രസീതുകൾ Ads Manager → Billing-ൽ ലഭിക്കും."],
se:"ക്ലയന്റ് ജോലിയിൽ നിങ്ങൾക്ക് എങ്ങനെ വരുമാനം",le:["പരസ്യച്ചെലവ് നിങ്ങളുടെ വരുമാനമല്ല. ക്ലയന്റ് അത് നേരിട്ട് Meta-ക്ക് നൽകണം.","നിങ്ങളുടെ വരുമാനം സർവീസ് ഫീ ആണ്: ഒറ്റത്തവണ സെറ്റപ്പ് ഫീ, അല്ലെങ്കിൽ പ്രതിമാസ മാനേജ്മെന്റ് ഫീ.","പരസ്യ ബജറ്റും ഫീസും വെവ്വേറെ പറയുക: \"പരസ്യ ബജറ്റ് ₹{total} Meta-ക്ക്, എന്റെ ഫീ വേറെ.\"","ക്ലയന്റിന്റെ അക്കൗണ്ടിൽ നിങ്ങളെ പാർട്ണറോ അഡ്മിനോ ആയി ചേർക്കാൻ പറയുക. അവരുടെ കാർഡോ UPI-യോ കൈവശം വയ്ക്കരുത്.","ആദ്യ 7 ദിവസത്തിന് ശേഷം ചെറിയ റിപ്പോർട്ട് നൽകുക (റീച്ച്, മെസ്സേജുകൾ, ചെലവ്). ഫലം ഒരിക്കലും വാഗ്ദാനം ചെയ്യരുത്."],

n_dark:"വളരെ ഇരുണ്ടതാണ്, വിശദാംശങ്ങൾ നഷ്ടപ്പെടുന്നു.",n_bright:"തെളിച്ചം വളരെ കൂടുതൽ, ചില ഭാഗങ്ങൾ വെളുത്തുപോയി.",n_con:"മങ്ങിയതും ഫ്ലാറ്റുമാണ്, കോൺട്രാസ്റ്റ് കുറവ്.",n_sharp:"മങ്ങിയതോ ഫോക്കസ് തെറ്റിയതോ ആണ്.",n_res:"റെസല്യൂഷൻ കുറവാണ്, പിക്സലേറ്റ് ആയി തോന്നും.",n_fmt:"Instagram-ന് അനുയോജ്യമായ ഫോർമാറ്റല്ല.",n_short:"വീഡിയോ വളരെ ചെറുതാണ് (5 സെക്കൻഡിൽ താഴെ).",n_long:"വീഡിയോ നീളം കൂടുതലാണ് (60 സെക്കൻഡിൽ കൂടുതൽ). ചെറിയ വീഡിയോകൾക്ക് കാഴ്ചക്കാർ കൂടും.",

k1:"எழுத்து குறைவாக வையுங்கள், ஒலி இல்லாவிட்டாலும் புரிய வேண்டும்.",k2:"இறுதியில் உங்கள் சலுகை அல்லது பட்டனைக் காட்டுங்கள்: {cta}.",
s5:"கேப்ஷன் மற்றும் ஹாஷ்டேக்",btnL:"பட்டன்",tagTip:"5–8 ஹாஷ்டேக் போதும். கட்டண ரீச்சை அதிகரிப்பது ஹாஷ்டேக் அல்ல, டார்கெட்டிங்.",
s6:"விளம்பரம் ஓட்ட சிறந்த நேரம்",w_food:"மதியம் 11–1, மாலை 6–9",w_other:"மாலை 6–9, வார இறுதிகளிலும்",s6n:"அட்டவணையை 24 மணி நேரமும் இயக்கத்தில் வைக்கலாம், சிறந்த நேரத்தை Meta கண்டுபிடிக்கும்.",
s7:"Ads Manager-ல் படிப்படியாக அமைக்க",l7:["Facebook Page உருவாக்கி, Instagram-ஐ 'Professional' கணக்காக மாற்றி அந்த Page-உடன் இணைக்கவும்.","Instagram-ல் ரீல் அல்லது புகைப்படத்தை பதிவிட்டு Boost அழுத்தவும், அல்லது business.facebook.com → Ads Manager → Create திறக்கவும்.","மேலே உள்ள இலக்கைத் தேர்ந்தெடுக்கவும்.","ஆடியன்ஸை அமைக்கவும்: இடம், வயது, ஆர்வங்கள்.","Placements தேர்ந்தெடுக்கவும்.","தினசரி பட்ஜெட் ₹{bud}, {days} நாட்களுக்குப் பிறகு முடிவு தேதி வையுங்கள்.","உங்கள் பதிவை விளம்பரமாகத் தேர்ந்தெடுத்து பட்டனை {cta} என வையுங்கள்.","கட்டண முறையை (UPI அல்லது கார்டு) சேர்த்து Publish அழுத்தவும்."],s7n:"விளம்பர மதிப்பாய்வுக்கு ஒரு நாள் வரை ஆகலாம்.",
s8:"3–4 நாட்களுக்குப் பிறகு என்ன செய்ய வேண்டும்",l8:["முதல் 2 நாட்கள் எதையும் மாற்றாதீர்கள். Meta இன்னும் கற்றுக்கொண்டிருக்கிறது.","மெசேஜ்கள் அல்லது முடிவுகள் வந்தால் பட்ஜெட்டை சுமார் 20% உயர்த்துங்கள்.","மக்கள் விளம்பரத்தைப் பார்த்தும் கிளிக் அல்லது மெசேஜ் செய்யவில்லை என்றால் வீடியோவின் முதல் 3 வினாடிகள் அல்லது பட்டனை மாற்றுங்கள்.","கிட்டத்தட்ட யாரும் பார்க்கவில்லை என்றால் இடம் அல்லது வயது வரம்பை விரிவாக்குங்கள், அல்லது பட்ஜெட்டை உயர்த்துங்கள்.","ஒரு நேரத்தில் ஒரே ஒன்றை மட்டும் மாற்றுங்கள்."],
sp:"விளம்பரப் பணம் எப்படி செலுத்தப்படும்",lp:["விளம்பரச் செலவு Meta-க்கு விளம்பரதாரரின் சொந்த கட்டண முறையில் செலுத்தப்படும்: UPI, கார்டு அல்லது நெட் பேங்கிங் (கணக்கைப் பொறுத்து).","விளம்பரம் ஓடும் அளவுக்கு மட்டுமே பணம் கழியும். முடிவு தேதி வைத்தால் ₹{total} அதிகபட்சம்.","கணக்கு ப்ரீபெய்டு (முதலில் பணம் சேர்க்க) அல்லது போஸ்ட்பெய்டு (பின்னர் பில்) ஆகலாம். கட்டண முறை சேர்க்கும் வரை விளம்பரம் ஓடாது.","பில்லில் GST சேரலாம், விளம்பர பட்ஜெட்டுக்கு மேல் கூடுதல் செலவாகக் கருதுங்கள்.","ரசீதுகள் Ads Manager → Billing-ல் கிடைக்கும்."],
se:"வாடிக்கையாளர் வேலையில் உங்களுக்கு எப்படி வருமானம்",le:["விளம்பரச் செலவு உங்கள் வருமானம் அல்ல. வாடிக்கையாளர் அதை நேரடியாக Meta-க்கு செலுத்துவார்.","உங்கள் வருமானம் சேவைக் கட்டணம்: ஒருமுறை செட்டப் கட்டணம், அல்லது மாதாந்திர மேலாண்மைக் கட்டணம்.","விளம்பர பட்ஜெட்டையும் உங்கள் கட்டணத்தையும் தனித்தனியாகச் சொல்லுங்கள்: \"விளம்பர பட்ஜெட் ₹{total} Meta-க்கு, என் கட்டணம் தனி.\"","வாடிக்கையாளரின் கணக்கில் உங்களை பார்ட்னர் அல்லது அட்மினாகச் சேர்க்கச் சொல்லுங்கள். அவர்களின் கார்டு அல்லது UPI-ஐ உங்களிடம் வைத்திருக்காதீர்கள்.","முதல் 7 நாட்களுக்குப் பிறகு சிறு அறிக்கை கொடுங்கள் (ரீச், மெசேஜ், செலவு). முடிவுகளுக்கு ஒருபோதும் உறுதி கூறாதீர்கள்."],

p_light:"வெளிச்சம் நன்றாகவும் சீராகவும் உள்ளது.",p_con:"கான்ட்ராஸ்ட் நன்று, விவரங்கள் தெளிவாகத் தெரிகின்றன.",p_sharp:"தெளிவாகவும் கூர்மையாகவும் உள்ளது.",p_res:"Instagram-க்கு ஏற்ற ரெசொலூஷன்.",p_fmt:"Reels/Stories/Feed-க்கு ஏற்ற வடிவம்.",
n_dark:"மிகவும் இருட்டாக உள்ளது, விவரங்கள் இழக்கப்படுகின்றன.",n_bright:"வெளிச்சம் அதிகம், சில பகுதிகள் வெளுத்துவிட்டன.",n_con:"மங்கலாகவும் தட்டையாகவும் உள்ளது, கான்ட்ராஸ்ட் குறைவு.",n_sharp:"மங்கலாக உள்ளது அல்லது ஃபோகஸ் தவறியுள்ளது.",n_res:"ரெசொலூஷன் குறைவு, பிக்சல்கள் தெரியும்.",n_fmt:"Instagram-க்கு ஏற்ற வடிவம் அல்ல.",n_short:"வீடியோ மிகக் குறுகியது (5 வினாடிக்கு குறைவு).",n_long:"வீடியோ நீளமானது (60 வினாடிக்கு மேல்). குறுகிய வீடியோக்களை அதிகம் பேர் பார்ப்பார்கள்.",
f_dark:"ஜன்னல் அருகில் அல்லது பகல் வெளிச்சத்தில் எடுங்கள், அல்லது பிரைட்னஸை சிறிது கூட்டுங்கள்.",f_bright:"நேரடி வெயிலில் இருந்து விலகுங்கள் அல்லது எக்ஸ்போஷரைக் குறையுங்கள்.",f_con:"எடிட் செய்யும்போது கான்ட்ராஸ்ட் மற்றும் சாச்சுரேஷனை சிறிது கூட்டுங்கள்.",f_sharp:"ஃபோகஸ் செய்ய திரையைத் தொடுங்கள், போனை நிலையாகப் பிடியுங்கள், லென்ஸைத் துடையுங்கள். தேவைப்பட்டால் மீண்டும் எடுங்கள்.",f_res:"1080p அல்லது அதற்கு மேல் எடுங்கள்; ஸ்கிரீன்ஷாட் அல்லது ஃபார்வர்டு செய்த படத்தைப் பயன்படுத்தாதீர்கள்.",f_fmt:"Reels/Stories-க்கு செங்குத்து 9:16, Feed-க்கு 4:5 பயன்படுத்துங்கள்.",f_len:"15–30 வினாடிகள் போதும், முதல் 3 வினாடிகளை வலுவாக்குங்கள்.",
v_good:"பயன்படுத்தத் தயார். சிறு மேம்பாடுகள் இன்னும் உதவும்.",v_mid:"பயன்படுத்தலாம், ஆனால் கீழே உள்ளவற்றை சரிசெய்தால் மேம்படும்.",v_bad:"விளம்பரத்துக்கு பணம் செலவிடும் முன் இதை மேம்படுத்த வேண்டும்.",none:"பெரிய குறைகள் இல்லை.",
qNote:"இது தொழில்நுட்பத் தரத்தை (வெளிச்சம், கூர்மை, அளவு, வடிவம்) மட்டுமே சோதிக்கிறது, படத்தில் உள்ளதை அல்ல. ரீச் எண்கள் தோராய மதிப்பீடுகள் மட்டுமே."}

en:{k3:"Use different-looking photos or videos, not near-copies. Meta now scores creative diversity.",ck6:"Accept Meta's new ad terms if asked (they apply from 30 October 2026).",waPrice:"WhatsApp's message pricing changed on 1 October 2026. Check the current rates in your WhatsApp Business account before you run chat ads.",tag:"Focus. Plan. Succeed.",hwT:"How it works",metaChk:"Meta guidance last checked",metaOld:"This guidance is more than 4 months old. Meta changes Ads Manager often, so check each step against what you see on screen.",nDash:"Dashboard",nCheck:"Photo / video check",nForm:"Business details",nPlan:"My ad plan",gm1:"Good morning",gm2:"Good afternoon",gm3:"Good evening",hiL:"Hi",hiG:"Hi there",heroT:"Let's plan your next Instagram ad. It takes about two minutes.",heroB:"Create an ad plan",stPlans:"Plans created",stScore:"Last quality score",stBud:"Last plan budget",stNext:"Days planned",chQ:"Quality breakdown",chB:"Budget by phase",phL:"Learn (days 1–3)",phO:"Optimise (days 4–7)",phS:"Scale (day 8+)",chNoQ:"Check a photo or video to see this chart.",chNoB:"Create an ad plan to see this chart.",rcT:"Recent plans",rcNone:"Your plans will appear here.",rcOpen:"Open",hlpT:"Need a hand?",hlpS:"Chat with us on WhatsApp and we will help you set up your ad.",hlpB:"Chat on WhatsApp",sVid:"Watch step-by-step video tutorials",vNote:"These open a YouTube search in your language. We have not reviewed each video, so pick a recent one (2025 or later), because Ads Manager screens change.",vL1:"How to set up this campaign",vL2:"How to add a payment method",vL3:"WhatsApp Business setup",sPay:"How to add a payment method and pay for ads",pOpts:"Common options in India: UPI, debit or credit card, and net banking. What you see depends on your account, so check in Billing.",lPay:["Open Ads Manager and go to Billing (or Payment settings).","Tap Add payment method and choose UPI, card or net banking. Finish the bank verification.","Choose how you pay. Prepaid means you add money first and the ad stops when it runs out, which keeps you in control. Automatic means Meta charges your method as the ad spends.","Set an account spending limit that matches your budget so you never pay more than planned.","Keep a small buffer in the account or card. A failed payment can pause your ads.","Never share your OTP or card details with anyone. After each payment, download the invoice from Billing for your records and GST."],q_color:"Colour",p_color:"Colours look vivid and natural.",n_dull:"Colours look dull and washed out.",n_over:"Colours are over-saturated and look unnatural.",f_dull:"Raise saturation or vibrance a little, and shoot in daylight.",f_over:"Lower saturation a little so skin and food look natural.",n_clip:"Large areas are pure black or pure white, so detail is lost.",f_clip:"Lower the exposure to save the bright areas, or lift the shadows.",btnEnh:"Improve this photo automatically",enhT:"Auto-improved photo",enhBefore:"Before",enhAfter:"After",enhDl:"Download improved photo",enhNote:"Auto-improve fixes light, contrast and colour. It cannot fix blur or low resolution. Check that it looks natural before you use it.",enhScore:"Score after auto-improve",sWa:"Set up WhatsApp for your ad",lWa:["Install the WhatsApp Business app on your business number. Keep it separate from your personal WhatsApp.","Fill in the business profile: name, address, opening hours, website and a short description.","In the WhatsApp Business settings, connect your Facebook Page and Instagram account so the ad can open your chat.","Set a greeting message for new chats and an away message for after hours.","Save quick replies for the questions you get most: price, location, timings, delivery.","In Ads Manager, choose WhatsApp as the message destination, add a pre-filled message and a few ice-breaker questions people can tap.","Before you spend, tap your own ad from another phone and send a message. Check that it arrives.","Use labels (New, Paid, Follow up) to track every chat. Reply within minutes."],waNote:"Only send bulk messages to people who have agreed to receive them. Unwanted bulk messages can get your number blocked.",tipsT:"Tips for this goal",tip_aware:["Use a short, eye-catching video. The first 3 seconds decide if people keep watching.","Show your name or logo early so people remember you.","Don't expect messages or sales from this goal. Success is reach and people remembering you."],tip_traffic:["Decide where people should land first (profile, website, WhatsApp or a call) and make sure it works on a phone.","Tell people what they will find when they click, in the caption and in the video.","Watch cost per click. If clicks are cheap but nobody does anything, fix the landing page, not the ad."],tip_engage:["End the video with a clear ask: \"Message us on WhatsApp\".","Reply to every message within minutes. Slow replies waste your ad money.","Save quick replies in WhatsApp Business for price, location and timings."],tip_leads:["Ask for as little as possible (name and phone number). Long forms lose people.","Offer something in return: a free quote, a trial or a discount.","Call or message new leads the same day. Waiting a few days makes them go cold."],tip_app:["Show the app on a phone screen in the video, with what it does in one line.","Make sure the app store page has screenshots and a clear description before you advertise.","Watch cost per install, then check how many people actually open the app."],tip_sales:["Install the Meta Pixel and test a purchase before spending, or Meta cannot find buyers.","Show the product, the price and a clear offer in the first few seconds.","Be patient: Meta needs about 50 purchases a week to learn, so start with a budget you can sustain."],g_aware:"Awareness",d_aware:"Show your ad to as many people as possible so they get to know you. Best when your business or product is new.",g_traffic:"Traffic",d_traffic:"Send people to a place: your Instagram profile, website, WhatsApp or a phone call. Best to get people to visit.",g_engage:"Engagement",d_engage:"Get people to react, watch your video or message you on WhatsApp. Best for building interest and chats.",g_leads:"Leads",d_leads:"Collect names and phone numbers of interested people through a form, WhatsApp or calls. Best for services and bookings.",g_app:"App promotion",d_app:"Get people to install your mobile app. Only for businesses that have an app.",g_sales:"Sales",d_sales:"Get people to buy on your website or app. Needs a website with tracking set up.",gl_traffic:"See more on our page",gl_engage:"Message us on WhatsApp",gl_leads:"Share your details and we will call you",gl_app:"Download the app",gl_aware:"Come and see what's new",recL:"Best fit for this business",aNote:"For awareness, judge the ad by reach and cost per 1,000 people reached, not by messages or sales.",hgT:"Trending on Google India today",tNote:"These are Google searches, not Instagram hashtags, and are often news or sports. Use one only if it truly fits your business. Never attach tragedies or politics to an ad.",tNone:"Today's trends couldn't be loaded.",cpy:"Copy",kGoal:"Goal",kAud:"Audience",kBud:"Daily budget",kDur:"Duration",kCnt:"Content",kChk:"First check-in",nDays:"{days} days",dayL:"Day",
sTl:"Day-by-day schedule",lTl:["Set up the campaign, double-check the button, link and caption, then publish.","Do nothing. Let Meta learn. Reply to every message quickly.","First check: reach, clicks and messages. Pause any ad that is clearly failing.","Change one thing only (hook, audience or button). Keep the best ad running.","If cost per result is good, raise the budget about 20%. If not, test a new video or offer."],
sCk:"Pre-launch checklist",lCk:["Instagram is a Professional account linked to your Facebook Page.","WhatsApp number or website link is correct (test it yourself).","Caption is proofread; offer, price and place are accurate.","Video or photo is sharp, bright and in the right format.","Payment method is added and the end date is set."],
sKp:"Weekly report card",lKp:["Reach|How many different people saw your ad. It should grow every day.","Cost per result|What you pay per message, click or order. Lower is better.","CTR (click rate)|Share of viewers who click. About 1% or more is a healthy sign.","Frequency|How many times one person saw the ad. Above 3 in a week means refresh the video."],

ml:{k3:"ഒരേപോലെ ഇരിക്കുന്നവയല്ല, വ്യത്യസ്തമായി തോന്നുന്ന ഫോട്ടോകളോ വീഡിയോകളോ ഉപയോഗിക്കുക. Meta ഇപ്പോൾ ക്രിയേറ്റീവ് വൈവിധ്യം സ്കോർ ചെയ്യുന്നുണ്ട്.",ck6:"ചോദിച്ചാൽ Meta-യുടെ പുതിയ പരസ്യ നിബന്ധനകൾ അംഗീകരിക്കുക (2026 ഒക്ടോബർ 30 മുതൽ ബാധകം).",waPrice:"WhatsApp-ന്റെ മെസ്സേജ് നിരക്കുകൾ 2026 ഒക്ടോബർ 1-ന് മാറി. ചാറ്റ് പരസ്യങ്ങൾ ഓടിക്കുംമുമ്പ് ഇപ്പോഴത്തെ നിരക്കുകൾ നിങ്ങളുടെ WhatsApp Business അക്കൗണ്ടിൽ പരിശോധിക്കുക.",tag:"ശ്രദ്ധിക്കൂ. പ്ലാൻ ചെയ്യൂ. വിജയിക്കൂ.",hwT:"ഇത് എങ്ങനെ പ്രവർത്തിക്കുന്നു",metaChk:"Meta മാർഗനിർദേശം അവസാനം പരിശോധിച്ചത്",metaOld:"ഈ മാർഗനിർദേശത്തിന് 4 മാസത്തിലധികം പഴക്കമുണ്ട്. Meta Ads Manager പതിവായി മാറ്റാറുണ്ട്, അതിനാൽ ഓരോ ഘട്ടവും സ്ക്രീനിൽ കാണുന്നതുമായി ഒത്തുനോക്കുക.",nDash:"ഡാഷ്ബോർഡ്",nCheck:"ഫോട്ടോ / വീഡിയോ പരിശോധന",nForm:"ബിസിനസ്സ് വിവരങ്ങൾ",nPlan:"എന്റെ പരസ്യ പ്ലാൻ",gm1:"സുപ്രഭാതം",gm2:"ശുഭ ഉച്ച",gm3:"ശുഭ സായാഹ്നം",hiL:"ഹായ്",hiG:"ഹായ്",heroT:"നിങ്ങളുടെ അടുത്ത Instagram പരസ്യം പ്ലാൻ ചെയ്യാം. ഏകദേശം രണ്ട് മിനിറ്റ് മതി.",heroB:"പരസ്യ പ്ലാൻ ഉണ്ടാക്കൂ",stPlans:"ഉണ്ടാക്കിയ പ്ലാനുകൾ",stScore:"അവസാന ക്വാളിറ്റി സ്കോർ",stBud:"അവസാന പ്ലാൻ ബജറ്റ്",stNext:"പ്ലാൻ ചെയ്ത ദിവസങ്ങൾ",chQ:"ഗുണനിലവാര വിശദാംശങ്ങൾ",chB:"ഘട്ടം തിരിച്ചുള്ള ബജറ്റ്",phL:"പഠനം (1–3 ദിവസം)",phO:"മെച്ചപ്പെടുത്തൽ (4–7 ദിവസം)",phS:"വളർച്ച (8+ ദിവസം)",chNoQ:"ഈ ചാർട്ട് കാണാൻ ഒരു ഫോട്ടോയോ വീഡിയോയോ പരിശോധിക്കുക.",chNoB:"ഈ ചാർട്ട് കാണാൻ ഒരു പരസ്യ പ്ലാൻ ഉണ്ടാക്കുക.",rcT:"അടുത്തിടെയുള്ള പ്ലാനുകൾ",rcNone:"നിങ്ങളുടെ പ്ലാനുകൾ ഇവിടെ കാണാം.",rcOpen:"തുറക്കുക",hlpT:"സഹായം വേണോ?",hlpS:"WhatsApp-ൽ ഞങ്ങളോട് ചാറ്റ് ചെയ്യൂ, പരസ്യം സെറ്റ് ചെയ്യാൻ സഹായിക്കാം.",hlpB:"WhatsApp-ൽ ചാറ്റ് ചെയ്യുക",sVid:"ഘട്ടം ഘട്ടമായുള്ള വീഡിയോ ട്യൂട്ടോറിയലുകൾ കാണുക",vNote:"ഇവ നിങ്ങളുടെ ഭാഷയിൽ YouTube സെർച്ച് തുറക്കും. ഓരോ വീഡിയോയും ഞങ്ങൾ പരിശോധിച്ചിട്ടില്ല, അതിനാൽ പുതിയത് (2025 അല്ലെങ്കിൽ അതിനുശേഷം) തിരഞ്ഞെടുക്കുക, കാരണം Ads Manager സ്ക്രീനുകൾ മാറിക്കൊണ്ടിരിക്കും.",vL1:"ഈ കാമ്പെയ്ൻ എങ്ങനെ സെറ്റ് ചെയ്യാം",vL2:"പേയ്‌മെന്റ് രീതി എങ്ങനെ ചേർക്കാം",vL3:"WhatsApp Business സെറ്റപ്പ്",sPay:"പേയ്‌മെന്റ് രീതി ചേർക്കുന്നതും പരസ്യത്തിന് പണം അടയ്ക്കുന്നതും എങ്ങനെ",pOpts:"ഇന്ത്യയിൽ സാധാരണ ഓപ്ഷനുകൾ: UPI, ഡെബിറ്റ്/ക്രെഡിറ്റ് കാർഡ്, നെറ്റ് ബാങ്കിംഗ്. നിങ്ങൾക്ക് കാണുന്നത് അക്കൗണ്ട് അനുസരിച്ചിരിക്കും, Billing-ൽ പരിശോധിക്കുക.",lPay:["Ads Manager തുറന്ന് Billing (അല്ലെങ്കിൽ Payment settings) തിരഞ്ഞെടുക്കുക.","Add payment method അമർത്തി UPI, കാർഡ് അല്ലെങ്കിൽ നെറ്റ് ബാങ്കിംഗ് തിരഞ്ഞെടുക്കുക. ബാങ്ക് വെരിഫിക്കേഷൻ പൂർത്തിയാക്കുക.","എങ്ങനെ അടയ്ക്കണമെന്ന് തിരഞ്ഞെടുക്കുക. പ്രീപെയ്ഡ് എന്നാൽ ആദ്യം പണം ചേർക്കും, തീർന്നാൽ പരസ്യം നിൽക്കും, നിയന്ത്രണം നിങ്ങളുടെ കയ്യിലാകും. ഓട്ടോമാറ്റിക് എന്നാൽ പരസ്യം ചെലവാകുന്നതനുസരിച്ച് Meta നിങ്ങളുടെ രീതിയിൽ നിന്ന് ഈടാക്കും.","നിങ്ങളുടെ ബജറ്റിന് ചേർന്ന അക്കൗണ്ട് സ്പെൻഡിംഗ് ലിമിറ്റ് സെറ്റ് ചെയ്യുക, പ്ലാൻ ചെയ്തതിലും കൂടുതൽ അടയ്ക്കേണ്ടി വരില്ല.","അക്കൗണ്ടിലോ കാർഡിലോ ചെറിയൊരു അധിക തുക വയ്ക്കുക. പേയ്‌മെന്റ് പരാജയപ്പെട്ടാൽ പരസ്യം നിൽക്കാം.","OTP-യോ കാർഡ് വിവരങ്ങളോ ആരുമായും പങ്കിടരുത്. ഓരോ പേയ്‌മെന്റിനും ശേഷം രേഖയ്ക്കും GST-ക്കും വേണ്ടി Billing-ൽ നിന്ന് ഇൻവോയ്സ് ഡൗൺലോഡ് ചെയ്യുക."],q_color:"നിറം",p_color:"നിറങ്ങൾ തെളിഞ്ഞതും സ്വാഭാവികവുമാണ്.",n_dull:"നിറങ്ങൾ മങ്ങിയതും വിളറിയതുമാണ്.",n_over:"നിറം വളരെ കൂടുതൽ തെളിഞ്ഞ് അസ്വാഭാവികമായി തോന്നുന്നു.",f_dull:"സാച്ചുറേഷൻ അല്പം കൂട്ടുക, പകൽവെളിച്ചത്തിൽ ഷൂട്ട് ചെയ്യുക.",f_over:"സാച്ചുറേഷൻ അല്പം കുറയ്ക്കുക, അപ്പോൾ ചർമ്മവും ഭക്ഷണവും സ്വാഭാവികമായി തോന്നും.",n_clip:"വലിയ ഭാഗങ്ങൾ തനി കറുപ്പോ തനി വെളുപ്പോ ആണ്, അതിനാൽ വിശദാംശങ്ങൾ നഷ്ടപ്പെടുന്നു.",f_clip:"തെളിഞ്ഞ ഭാഗങ്ങൾ രക്ഷിക്കാൻ എക്സ്പോഷർ കുറയ്ക്കുക, അല്ലെങ്കിൽ നിഴൽ ഭാഗങ്ങൾ ഉയർത്തുക.",btnEnh:"ഫോട്ടോ ഓട്ടോമാറ്റിക്കായി മെച്ചപ്പെടുത്തുക",enhT:"മെച്ചപ്പെടുത്തിയ ഫോട്ടോ",enhBefore:"മുമ്പ്",enhAfter:"ശേഷം",enhDl:"മെച്ചപ്പെടുത്തിയ ഫോട്ടോ ഡൗൺലോഡ് ചെയ്യുക",enhNote:"ഓട്ടോ-ഇമ്പ്രൂവ് വെളിച്ചം, കോൺട്രാസ്റ്റ്, നിറം എന്നിവ ശരിയാക്കും. മങ്ങലോ കുറഞ്ഞ റെസല്യൂഷനോ ശരിയാക്കാനാവില്ല. ഉപയോഗിക്കുംമുമ്പ് സ്വാഭാവികമായി തോന്നുന്നുണ്ടോ എന്ന് നോക്കുക.",enhScore:"ഓട്ടോ-ഇമ്പ്രൂവിന് ശേഷമുള്ള സ്കോർ",sWa:"നിങ്ങളുടെ പരസ്യത്തിനായി WhatsApp സെറ്റ് ചെയ്യുക",lWa:["നിങ്ങളുടെ ബിസിനസ്സ് നമ്പറിൽ WhatsApp Business ആപ്പ് ഇൻസ്റ്റാൾ ചെയ്യുക. സ്വകാര്യ WhatsApp-ൽ നിന്ന് വേറെയായി വയ്ക്കുക.","ബിസിനസ്സ് പ്രൊഫൈൽ പൂരിപ്പിക്കുക: പേര്, വിലാസം, പ്രവർത്തന സമയം, വെബ്സൈറ്റ്, ചെറിയ വിവരണം.","WhatsApp Business സെറ്റിംഗ്സിൽ നിങ്ങളുടെ Facebook Page-ഉം Instagram അക്കൗണ്ടും ബന്ധിപ്പിക്കുക, അപ്പോൾ പരസ്യത്തിന് നിങ്ങളുടെ ചാറ്റ് തുറക്കാനാകും.","പുതിയ ചാറ്റുകൾക്ക് ഗ്രീറ്റിംഗ് മെസ്സേജും പ്രവർത്തന സമയത്തിന് ശേഷമുള്ളതിന് എവേ മെസ്സേജും സെറ്റ് ചെയ്യുക.","ഏറ്റവും കൂടുതൽ വരുന്ന ചോദ്യങ്ങൾക്ക് ക്വിക്ക് റിപ്ലൈ സേവ് ചെയ്യുക: വില, സ്ഥലം, സമയം, ഡെലിവറി.","Ads Manager-ൽ മെസ്സേജ് ഡെസ്റ്റിനേഷനായി WhatsApp തിരഞ്ഞെടുക്കുക, മുൻകൂട്ടി എഴുതിയ മെസ്സേജും ആളുകൾക്ക് തൊടാവുന്ന കുറച്ച് ഐസ്-ബ്രേക്കർ ചോദ്യങ്ങളും ചേർക്കുക.","പണം ചെലവാക്കുംമുമ്പ് മറ്റൊരു ഫോണിൽ നിന്ന് സ്വന്തം പരസ്യത്തിൽ തൊട്ട് ഒരു മെസ്സേജ് അയച്ച് അത് എത്തുന്നുണ്ടോ എന്ന് നോക്കുക.","ഓരോ ചാറ്റും ട്രാക്ക് ചെയ്യാൻ ലേബലുകൾ (New, Paid, Follow up) ഉപയോഗിക്കുക. മിനിറ്റുകൾക്കുള്ളിൽ മറുപടി നൽകുക."],waNote:"സമ്മതം നൽകിയവർക്ക് മാത്രം ബൾക്ക് മെസ്സേജ് അയക്കുക. ആവശ്യമില്ലാത്ത ബൾക്ക് മെസ്സേജുകൾ നിങ്ങളുടെ നമ്പർ ബ്ലോക്ക് ചെയ്യപ്പെടാൻ കാരണമാകും.",tipsT:"ഈ ലക്ഷ്യത്തിനുള്ള നുറുങ്ങുകൾ",tip_aware:["ചെറിയതും ശ്രദ്ധ കിട്ടുന്നതുമായ വീഡിയോ ഉപയോഗിക്കുക. ആദ്യ 3 സെക്കൻഡാണ് ആളുകൾ തുടർന്ന് കാണുമോ എന്ന് തീരുമാനിക്കുന്നത്.","ആളുകൾ ഓർത്തിരിക്കാൻ നിങ്ങളുടെ പേരോ ലോഗോയോ തുടക്കത്തിൽ തന്നെ കാണിക്കുക.","ഈ ലക്ഷ്യത്തിൽ നിന്ന് മെസ്സേജോ വിൽപ്പനയോ പ്രതീക്ഷിക്കരുത്. റീച്ചും ആളുകൾ നിങ്ങളെ ഓർക്കുന്നതുമാണ് വിജയം."],tip_traffic:["ആളുകൾ ആദ്യം എവിടെ എത്തണമെന്ന് (പ്രൊഫൈൽ, വെബ്സൈറ്റ്, WhatsApp അല്ലെങ്കിൽ കോൾ) തീരുമാനിക്കുക, അത് ഫോണിൽ ശരിക്കും പ്രവർത്തിക്കുന്നുണ്ടെന്ന് ഉറപ്പാക്കുക.","ക്ലിക്ക് ചെയ്താൽ എന്താണ് കാണുക എന്ന് ക്യാപ്ഷനിലും വീഡിയോയിലും പറയുക.","ഒരു ക്ലിക്കിന്റെ ചെലവ് നോക്കുക. ക്ലിക്ക് ചെലവ് കുറവും ആരും ഒന്നും ചെയ്യുന്നില്ലെങ്കിൽ പരസ്യമല്ല, ലാൻഡിംഗ് പേജാണ് ശരിയാക്കേണ്ടത്."],tip_engage:["വീഡിയോ അവസാനിപ്പിക്കുമ്പോൾ വ്യക്തമായി പറയുക: \"WhatsApp-ൽ മെസ്സേജ് അയക്കൂ\".","എല്ലാ മെസ്സേജിനും മിനിറ്റുകൾക്കുള്ളിൽ മറുപടി നൽകുക. വൈകിയാൽ പരസ്യത്തിന്റെ പണം പാഴാകും.","വില, സ്ഥലം, സമയം എന്നിവയ്ക്ക് WhatsApp Business-ൽ ക്വിക്ക് റിപ്ലൈ സേവ് ചെയ്യുക."],tip_leads:["കഴിയുന്നത്ര കുറച്ച് മാത്രം ചോദിക്കുക (പേരും ഫോൺ നമ്പറും). നീണ്ട ഫോം ആളുകളെ നഷ്ടപ്പെടുത്തും.","പകരം എന്തെങ്കിലും നൽകുക: സൗജന്യ ക്വോട്ട്, ട്രയൽ, ഡിസ്കൗണ്ട്.","പുതിയ ലീഡുകളെ അതേ ദിവസം തന്നെ വിളിക്കുകയോ മെസ്സേജ് അയക്കുകയോ ചെയ്യുക. കാത്തിരുന്നാൽ അവർക്ക് താൽപ്പര്യം പോകും."],tip_app:["വീഡിയോയിൽ ഫോൺ സ്ക്രീനിൽ ആപ്പ് കാണിക്കുക, അത് എന്ത് ചെയ്യുന്നു എന്ന് ഒരു വരിയിൽ പറയുക.","പരസ്യം ചെയ്യുംമുമ്പ് ആപ്പ് സ്റ്റോർ പേജിൽ സ്ക്രീൻഷോട്ടുകളും വ്യക്തമായ വിവരണവും ഉണ്ടെന്ന് ഉറപ്പാക്കുക.","ഒരു ഇൻസ്റ്റാളിന്റെ ചെലവ് നോക്കുക, പിന്നെ എത്ര പേർ ആപ്പ് തുറക്കുന്നു എന്നും."],tip_sales:["ചെലവാക്കുംമുമ്പ് Meta Pixel ഇൻസ്റ്റാൾ ചെയ്ത് ഒരു പർച്ചേസ് ടെസ്റ്റ് ചെയ്യുക, അല്ലെങ്കിൽ വാങ്ങുന്നവരെ Meta-ക്ക് കണ്ടെത്താനാവില്ല.","ആദ്യ സെക്കൻഡുകളിൽ ഉൽപ്പന്നം, വില, വ്യക്തമായ ഓഫർ എന്നിവ കാണിക്കുക.","ക്ഷമയോടെ ഇരിക്കുക: പഠിക്കാൻ Meta-ക്ക് ആഴ്ചയിൽ ഏകദേശം 50 പർച്ചേസ് വേണം, അതിനാൽ തുടരാൻ പറ്റുന്ന ബജറ്റിൽ തുടങ്ങുക."],g_aware:"അവയർനെസ് (Awareness)",d_aware:"കൂടുതൽ ആളുകൾ നിങ്ങളെ അറിയാൻ പരസ്യം പരമാവധി പേരിലേക്ക് എത്തിക്കും. ബിസിനസ്സോ ഉൽപ്പന്നമോ പുതിയതാണെങ്കിൽ ഏറ്റവും നല്ലത്.",g_traffic:"ട്രാഫിക് (Traffic)",d_traffic:"ആളുകളെ ഒരിടത്തേക്ക് എത്തിക്കും: നിങ്ങളുടെ Instagram പ്രൊഫൈൽ, വെബ്സൈറ്റ്, WhatsApp അല്ലെങ്കിൽ ഫോൺ കോൾ. ആളുകൾ വന്ന് കാണണമെങ്കിൽ നല്ലത്.",g_engage:"എൻഗേജ്മെന്റ് (Engagement)",d_engage:"ആളുകൾ പ്രതികരിക്കാനും വീഡിയോ കാണാനും WhatsApp-ൽ മെസ്സേജ് അയക്കാനും സഹായിക്കും. താൽപ്പര്യവും ചാറ്റുകളും കൂട്ടാൻ നല്ലത്.",g_leads:"ലീഡ്സ് (Leads)",d_leads:"ഫോം, WhatsApp അല്ലെങ്കിൽ കോൾ വഴി താൽപ്പര്യമുള്ളവരുടെ പേരും ഫോൺ നമ്പറും ശേഖരിക്കും. സേവനങ്ങൾക്കും ബുക്കിംഗിനും നല്ലത്.",g_app:"ആപ്പ് പ്രൊമോഷൻ (App promotion)",d_app:"ആളുകളെ നിങ്ങളുടെ മൊബൈൽ ആപ്പ് ഇൻസ്റ്റാൾ ചെയ്യിക്കും. ആപ്പ് ഉള്ള ബിസിനസ്സുകൾക്ക് മാത്രം.",g_sales:"വിൽപ്പന (Sales)",d_sales:"നിങ്ങളുടെ വെബ്സൈറ്റിലോ ആപ്പിലോ ആളുകൾ വാങ്ങാൻ സഹായിക്കും. ട്രാക്കിംഗ് സെറ്റ് ചെയ്ത വെബ്സൈറ്റ് വേണം.",gl_traffic:"ഞങ്ങളുടെ പേജിൽ കൂടുതൽ കാണൂ",gl_engage:"WhatsApp-ൽ മെസ്സേജ് അയക്കൂ",gl_leads:"നിങ്ങളുടെ വിവരങ്ങൾ തരൂ, ഞങ്ങൾ വിളിക്കാം",gl_app:"ആപ്പ് ഡൗൺലോഡ് ചെയ്യൂ",gl_aware:"വന്ന് പുതിയത് കാണൂ",recL:"ഈ ബിസിനസ്സിന് ഏറ്റവും ചേരുന്നത്",aNote:"അവയർനെസ്സിൽ പരസ്യം വിലയിരുത്തേണ്ടത് റീച്ചും 1,000 പേരിലേക്ക് എത്താനുള്ള ചെലവും നോക്കിയാണ്, മെസ്സേജോ വിൽപ്പനയോ നോക്കിയല്ല.",hgT:"ഇന്ന് ഇന്ത്യയിൽ Google-ൽ ട്രെൻഡിംഗ്",tNote:"ഇവ Google തിരച്ചിലുകളാണ്, Instagram ഹാഷ്ടാഗുകളല്ല, പലപ്പോഴും വാർത്തയോ കായികമോ ആയിരിക്കും. നിങ്ങളുടെ ബിസിനസ്സിന് ശരിക്കും ചേരുന്നതാണെങ്കിൽ മാത്രം ഉപയോഗിക്കുക. ദുരന്തങ്ങളെയോ രാഷ്ട്രീയത്തെയോ പരസ്യത്തോട് ചേർക്കരുത്.",tNone:"ഇന്നത്തെ ട്രെൻഡുകൾ ലോഡ് ചെയ്യാനായില്ല.",cpy:"കോപ്പി",kGoal:"ലക്ഷ്യം",kAud:"ഓഡിയൻസ്",kBud:"ദിവസ ബജറ്റ്",kDur:"കാലാവധി",kCnt:"കണ്ടന്റ്",kChk:"ആദ്യ പരിശോധന",nDays:"{days} ദിവസം",dayL:"ദിവസം",
sTl:"ദിവസം തോറുമുള്ള ഷെഡ്യൂൾ",lTl:["കാമ്പെയ്ൻ സെറ്റ് ചെയ്യുക, ബട്ടൺ, ലിങ്ക്, ക്യാപ്ഷൻ ഒന്നുകൂടി നോക്കി Publish ചെയ്യുക.","ഒന്നും ചെയ്യരുത്. Meta പഠിക്കട്ടെ. എല്ലാ മെസ്സേജിനും വേഗം മറുപടി നൽകുക.","ആദ്യ പരിശോധന: റീച്ച്, ക്ലിക്ക്, മെസ്സേജ്. വ്യക്തമായി പരാജയപ്പെടുന്ന പരസ്യം നിർത്തുക.","ഒരു കാര്യം മാത്രം മാറ്റുക (ഹുക്ക്, ഓഡിയൻസ് അല്ലെങ്കിൽ ബട്ടൺ). ഏറ്റവും മികച്ച പരസ്യം ഓടിക്കുക.","ഒരു റിസൾട്ടിന്റെ ചെലവ് നല്ലതാണെങ്കിൽ ബജറ്റ് ഏകദേശം 20% കൂട്ടുക. അല്ലെങ്കിൽ പുതിയ വീഡിയോയോ ഓഫറോ പരീക്ഷിക്കുക."],
sCk:"പബ്ലിഷ് ചെയ്യുംമുമ്പ് പരിശോധിക്കാൻ",lCk:["Instagram 'Professional' അക്കൗണ്ടാണ്, Facebook Page-മായി ബന്ധിപ്പിച്ചിട്ടുണ്ട്.","WhatsApp നമ്പറോ വെബ്സൈറ്റ് ലിങ്കോ ശരിയാണ് (സ്വയം തുറന്ന് നോക്കുക).","ക്യാപ്ഷനിൽ അക്ഷരത്തെറ്റില്ല, ഓഫർ, വില, സ്ഥലം എന്നിവ ശരിയാണ്.","വീഡിയോ/ഫോട്ടോ വ്യക്തവും തെളിച്ചമുള്ളതും ശരിയായ ഫോർമാറ്റിലുമാണ്.","പേയ്‌മെന്റ് രീതി ചേർത്തിട്ടുണ്ട്, അവസാന തീയതി നൽകിയിട്ടുണ്ട്."],
sKp:"ആഴ്ചതോറുമുള്ള റിപ്പോർട്ട് കാർഡ്",lKp:["റീച്ച്|എത്ര വ്യത്യസ്ത ആളുകൾ പരസ്യം കണ്ടു. ദിവസവും കൂടിവരണം.","ഒരു റിസൾട്ടിന്റെ ചെലവ്|ഒരു മെസ്സേജ്, ക്ലിക്ക് അല്ലെങ്കിൽ ഓർഡറിന് എത്ര ചെലവായി. കുറയുന്നതാണ് നല്ലത്.","CTR (ക്ലിക്ക് നിരക്ക്)|കണ്ടവരിൽ ക്ലിക്ക് ചെയ്തവരുടെ ശതമാനം. ഏകദേശം 1% അതിൽ കൂടുതൽ നല്ല ലക്ഷണം.","ഫ്രീക്വൻസി|ഒരാൾ പരസ്യം എത്ര തവണ കണ്ടു. ഒരാഴ്ച 3-ൽ കൂടിയാൽ വീഡിയോ മാറ്റുക."],
capMain:"നിങ്ങളുടെ ക്യാപ്ഷൻ (പോസ്റ്റ് ചെയ്യാൻ തയ്യാർ)",capRef:"മാതൃകാ ക്യാപ്ഷനുകൾ (വാക്കുകൾ നിങ്ങൾക്കനുസരിച്ച് മാറ്റുക)",cs1:"ഓഫർ",cs2:"കഥ",cs3:"ചോദ്യം",cs4:"വിശ്വാസം",
c1:"{biz}-ൽ പുതിയത്: {item}.\n{place}-ൽ ലഭ്യമാണ്.\n{line}.",c2:"{item} ശരിയായ രീതിയിൽ, ഓരോ ഉപഭോക്താവിനും വേണ്ടി നൽകാനാണ് ഞങ്ങൾ {biz} തുടങ്ങിയത്.\nനിങ്ങൾ {place}-ലാണെങ്കിൽ നേരിട്ട് വന്ന് കാണൂ.\n{line}.",c3:"{place}-ൽ {item} വേണമെങ്കിൽ നിങ്ങൾ എവിടെ പോകും?\nഒരു തവണ {biz} പരീക്ഷിച്ച് അഭിപ്രായം പറയൂ.\n{line}.",c4:"{place}-ലെ ഉപഭോക്താക്കൾ {item}-ന് വേണ്ടി വീണ്ടും വീണ്ടും {biz}-ൽ വരുന്നു.\nകാരണം അറിയൂ.\n{line}.",
hgR:"ശുപാർശ ചെയ്യുന്ന സെറ്റ് (ഇത് കോപ്പി ചെയ്യുക)",hgB:"വിശാലം (കൂടുതൽ ആളുകളിലേക്ക്)",hgN:"നിങ്ങളുടെ വിഭാഗം",hgL:"നിങ്ങളുടെ പ്രദേശം",tagTip:"പ്രസക്തമായ 3–10 ഹാഷ്ടാഗ് മതി. ഹാഷ്ടാഗ് പരിധികൾ മാറാം, പോസ്റ്റ് ചെയ്യുമ്പോൾ പരിശോധിക്കുക. പണം കൊടുത്തുള്ള റീച്ച് കൂട്ടുന്നത് ടാർഗെറ്റിംഗാണ്.",capNote:"നിങ്ങളുടെ ശൈലിക്ക് അനുസരിച്ച് വാക്കുകൾ മാറ്റുക. ഓഫർ ആദ്യ വരിയിൽ വയ്ക്കുക."},
hi:{k3:"लगभग एक जैसी नहीं, अलग-अलग दिखने वाली फ़ोटो या वीडियो इस्तेमाल करें। Meta अब क्रिएटिव डाइवर्सिटी को स्कोर करता है।",ck6:"पूछे जाने पर Meta की नई विज्ञापन शर्तें स्वीकार करें (ये 30 अक्टूबर 2026 से लागू होंगी)।",waPrice:"WhatsApp की मैसेज कीमतें 1 अक्टूबर 2026 को बदल गईं। चैट विज्ञापन चलाने से पहले अपने WhatsApp Business अकाउंट में मौजूदा दरें देख लें।",tag:"ध्यान दें। प्लान करें। सफल बनें।",hwT:"यह कैसे काम करता है",metaChk:"Meta मार्गदर्शन आख़िरी बार जाँचा गया",metaOld:"यह मार्गदर्शन 4 महीने से ज़्यादा पुराना है। Meta अक्सर Ads Manager बदलता है, इसलिए हर कदम को स्क्रीन पर दिख रही चीज़ से मिलाकर देखें।",nDash:"डैशबोर्ड",nCheck:"फ़ोटो / वीडियो जाँच",nForm:"बिज़नेस की जानकारी",nPlan:"मेरा विज्ञापन प्लान",gm1:"सुप्रभात",gm2:"नमस्ते",gm3:"शुभ संध्या",hiL:"नमस्ते",hiG:"नमस्ते",heroT:"अपना अगला Instagram विज्ञापन प्लान करें। लगभग दो मिनट लगते हैं।",heroB:"विज्ञापन प्लान बनाएँ",stPlans:"बनाए गए प्लान",stScore:"आख़िरी क्वालिटी स्कोर",stBud:"आख़िरी प्लान का बजट",stNext:"प्लान किए गए दिन",chQ:"क्वालिटी का ब्योरा",chB:"चरण के हिसाब से बजट",phL:"सीखना (दिन 1–3)",phO:"सुधारना (दिन 4–7)",phS:"बढ़ाना (दिन 8+)",chNoQ:"यह चार्ट देखने के लिए कोई फ़ोटो या वीडियो जाँचें।",chNoB:"यह चार्ट देखने के लिए विज्ञापन प्लान बनाएँ।",rcT:"हाल के प्लान",rcNone:"आपके प्लान यहाँ दिखेंगे।",rcOpen:"खोलें",hlpT:"मदद चाहिए?",hlpS:"WhatsApp पर हमसे चैट करें, हम विज्ञापन सेट करने में मदद करेंगे।",hlpB:"WhatsApp पर चैट करें",sVid:"कदम-दर-कदम वीडियो ट्यूटोरियल देखें",vNote:"ये आपकी भाषा में YouTube सर्च खोलते हैं। हमने हर वीडियो नहीं देखा है, इसलिए नया वीडियो (2025 या उसके बाद का) चुनें, क्योंकि Ads Manager की स्क्रीन बदलती रहती हैं।",vL1:"यह कैंपेन कैसे सेट करें",vL2:"पेमेंट तरीका कैसे जोड़ें",vL3:"WhatsApp Business सेटअप",sPay:"पेमेंट तरीका कैसे जोड़ें और विज्ञापन का भुगतान कैसे करें",pOpts:"भारत में आम विकल्प: UPI, डेबिट/क्रेडिट कार्ड और नेट बैंकिंग। आपको क्या दिखेगा यह आपके अकाउंट पर निर्भर है, Billing में देख लें।",lPay:["Ads Manager खोलें और Billing (या Payment settings) में जाएँ।","Add payment method दबाएँ और UPI, कार्ड या नेट बैंकिंग चुनें। बैंक वेरिफ़िकेशन पूरा करें।","चुनें कि भुगतान कैसे करना है। प्रीपेड में पहले पैसे डालते हैं और खत्म होने पर विज्ञापन रुक जाता है, इससे नियंत्रण आपके हाथ में रहता है। ऑटोमैटिक में विज्ञापन के खर्च के हिसाब से Meta आपके तरीके से पैसे काटता है।","अपने बजट के हिसाब से अकाउंट स्पेंडिंग लिमिट सेट करें ताकि तय से ज़्यादा ख़र्च न हो।","अकाउंट या कार्ड में थोड़ी अतिरिक्त रक़म रखें। भुगतान फ़ेल होने पर विज्ञापन रुक सकता है।","OTP या कार्ड की जानकारी किसी से साझा न करें। हर भुगतान के बाद रिकॉर्ड और GST के लिए Billing से इनवॉइस डाउनलोड करें।"],q_color:"रंग",p_color:"रंग चटख और नेचुरल हैं।",n_dull:"रंग फीके और बेजान लग रहे हैं।",n_over:"रंग ज़रूरत से ज़्यादा गहरे हैं और अप्राकृतिक लगते हैं।",f_dull:"सैचुरेशन थोड़ा बढ़ाएँ और दिन की रोशनी में शूट करें।",f_over:"सैचुरेशन थोड़ा घटाएँ ताकि त्वचा और खाना नेचुरल दिखे।",n_clip:"बड़े हिस्से पूरी तरह काले या सफ़ेद हैं, इसलिए डिटेल खो रही है।",f_clip:"चमकीले हिस्से बचाने के लिए एक्सपोज़र घटाएँ, या अंधेरे हिस्से उठाएँ।",btnEnh:"फ़ोटो अपने आप बेहतर करें",enhT:"बेहतर की गई फ़ोटो",enhBefore:"पहले",enhAfter:"बाद में",enhDl:"बेहतर की गई फ़ोटो डाउनलोड करें",enhNote:"ऑटो-इम्प्रूव रोशनी, कंट्रास्ट और रंग ठीक करता है। यह धुंधलापन या कम रेज़ोल्यूशन ठीक नहीं कर सकता। इस्तेमाल से पहले देख लें कि वह नेचुरल लग रही है।",enhScore:"ऑटो-इम्प्रूव के बाद स्कोर",sWa:"अपने विज्ञापन के लिए WhatsApp सेट करें",lWa:["अपने बिज़नेस नंबर पर WhatsApp Business ऐप इंस्टॉल करें। इसे अपने निजी WhatsApp से अलग रखें।","बिज़नेस प्रोफ़ाइल भरें: नाम, पता, खुलने का समय, वेबसाइट और छोटा विवरण।","WhatsApp Business सेटिंग्स में अपना Facebook Page और Instagram अकाउंट जोड़ें ताकि विज्ञापन से आपकी चैट खुल सके।","नई चैट के लिए ग्रीटिंग मैसेज और समय के बाद के लिए अवे मैसेज सेट करें।","सबसे ज़्यादा पूछे जाने वाले सवालों के क्विक रिप्लाई सेव करें: क़ीमत, जगह, समय, डिलीवरी।","Ads Manager में मैसेज डेस्टिनेशन के रूप में WhatsApp चुनें, पहले से लिखा मैसेज और कुछ आइस-ब्रेकर सवाल जोड़ें जिन्हें लोग टैप कर सकें।","पैसा लगाने से पहले दूसरे फ़ोन स ta:{k3:"ஒரே மாதிரியானவை அல்ல, வேறுபட்டு தெரியும் புகைப்படங்கள் அல்லது வீடியோக்களைப் பயன்படுத்துங்கள். Meta இப்போது கிரியேட்டிவ் பன்முகத்தன்மைக்கு மதிப்பெண் தருகிறது.",ck6:"கேட்கப்பட்டால் Meta-வின் புதிய விளம்பர விதிமுறைகளை ஏற்றுக்கொள்ளுங்கள் (அவை 2026 அக்டோபர் 30 முதல் பொருந்தும்).",waPrice:"WhatsApp-இன் செய்தி கட்டணங்கள் 2026 அக்டோபர் 1 அன்று மாறின. அரட்டை விளம்பரங்களை ஓட்டும் முன் உங்கள் WhatsApp Business கணக்கில் தற்போதைய கட்டணங்களைப் பாருங்கள்.",tag:"கவனம். திட்டம். வெற்றி.",hwT:"இது எப்படி வேலை செய்கிறது",metaChk:"Meta வழிகாட்டுதல் கடைசியாகச் சரிபார்த்தது",metaOld:"இந்த வழிகாட்டுதல் 4 மாதங்களுக்கு மேல் பழையது. Meta Ads Manager-ஐ அடிக்கடி மாற்றுகிறது, எனவே ஒவ்வொரு படியையும் திரையில் தெரிவதுடன் ஒப்பிட்டுப் பாருங்கள்.",nDash:"டாஷ்போர்டு",nCheck:"புகைப்படம் / வீடியோ சோதனை",nForm:"தொழில் விவரங்கள்",nPlan:"என் விளம்பரத் திட்டம்",gm1:"காலை வணக்கம்",gm2:"மதிய வணக்கம்",gm3:"மாலை வணக்கம்",hiL:"வணக்கம்",hiG:"வணக்கம்",heroT:"உங்கள் அடுத்த Instagram விளம்பரத்தைத் திட்டமிடுவோம். சுமார் இரண்டு நிமிடம் ஆகும்.",heroB:"விளம்பரத் திட்டத்தை உருவாக்கு",stPlans:"உருவாக்கிய திட்டங்கள்",stScore:"கடைசி தர மதிப்பெண்",stBud:"கடைசி திட்ட பட்ஜெட்",stNext:"திட்டமிட்ட நாட்கள்",chQ:"தர விவரம்",chB:"கட்டம் வாரியாக பட்ஜெட்",phL:"கற்றல் (நாள் 1–3)",phO:"மேம்படுத்தல் (நாள் 4–7)",phS:"விரிவாக்கம் (நாள் 8+)",chNoQ:"இந்த வரைபடத்தைப் பார்க்க ஒரு புகைப்படம் அல்லது வீடியோவைச் சோதியுங்கள்.",chNoB:"இந்த வரைபடத்தைப் பார்க்க ஒரு விளம்பரத் திட்டத்தை உருவாக்குங்கள்.",rcT:"சமீபத்திய திட்டங்கள்",rcNone:"உங்கள் திட்டங்கள் இங்கே தோன்றும்.",rcOpen:"திற",hlpT:"உதவி வேண்டுமா?",hlpS:"WhatsApp-ல் எங்களிடம் பேசுங்கள், விளம்பரத்தை அமைக்க உதவுவோம்.",hlpB:"WhatsApp-ல் பேசுங்கள்",sVid:"படிப்படியான வீடியோ பயிற்சிகளைப் பாருங்கள்",vNote:"இவை உங்கள் மொழியில் YouTube தேடலைத் திறக்கும். ஒவ்வொரு வீடியோவையும் நாங்கள் சரிபார்க்கவில்லை, எனவே புதியதை (2025 அல்லது அதற்குப் பின்) தேர்ந்தெடுங்கள், ஏனெனில் Ads Manager திரைகள் மாறுகின்றன.",vL1:"இந்த கேம்பெயினை எப்படி அமைப்பது",vL2:"கட்டண முறையை எப்படி சேர்ப்பது",vL3:"WhatsApp Business அமைப்பு",sPay:"கட்டண முறையை சேர்ப்பது மற்றும் விளம்பரத்துக்கு பணம் செலுத்துவது எப்படி",pOpts:"இந்தியாவில் பொதுவான வழிகள்: UPI, டெபிட்/கிரெடிட் கார்டு, நெட் பேங்கிங். உங்களுக்குத் தெரிவது உங்கள் கணக்கைப் பொறுத்தது, Billing-ல் பாருங்கள்.",lPay:["Ads Manager-ஐத் திறந்து Billing (அல்லது Payment settings) செல்லுங்கள்.","Add payment method தொட்டு UPI, கார்டு அல்லது நெட் பேங்கிங்கைத் தேர்ந்தெடுங்கள். வங்கி சரிபார்ப்பை முடியுங்கள்.","எப்படி செலுத்த வேண்டும் என்பதைத் தேர்ந்தெடுங்கள். ப்ரீபெய்டு என்றால் முதலில் பணம் சேர்ப்பீர்கள், தீர்ந்தால் விளம்பரம் நின்றுவிடும், கட்டுப்பாடு உங்களிடம் இருக்கும். தானியங்கி என்றால் விளம்பரம் செலவாகும் அளவுக்கு Meta உங்கள் முறையில் வசூலிக்கும்.","உங்கள் பட்ஜெட்டுக்கு ஏற்ற அக்கவுண்ட் ஸ்பெண்டிங் லிமிட்டை அமையுங்கள், திட்டமிட்டதை விட அதிகம் செலுத்த வேண்டியிருக்காது.","கணக்கிலோ கார்டிலோ சிறிது கூடுதல் தொகை வையுங்கள். கட்டணம் தோல்வியடைந்தால் விளம்பரம் நிற்கலாம்.","OTP அல்லது கார்டு விவரங்களை யாரிடமும் பகிராதீர்கள். ஒவ்வொரு கட்டணத்துக்கும் பிறகு பதிவுக்காகவும் GST-க்காகவும் Billing-ல் இருந்து இன்வாய்ஸை பதிவிறக்குங்கள்."],q_color:"நிறம்",p_color:"நிறங்கள் தெளிவாகவும் இயல்பாகவும் உள்ளன.",n_dull:"நிறங்கள் மங்கலாகவும் வெளுத்தும் உள்ளன.",n_over:"நிறங்கள் மிக அதிகமாக இருந்து இயல்பற்றதாகத் தெரிகின்றன.",f_dull:"சாச்சுரேஷனை சிறிது கூட்டுங்கள், பகல் வெளிச்சத்தில் எடுங்கள்.",f_over:"சாச்சுரேஷனை சிறிது குறையுங்கள், அப்போது தோலும் உணவும் இயல்பாகத் தெரியும்.",n_clip:"பெரிய பகுதிகள் முழுக் கருப்பாக அல்லது முழு வெள்ளையாக உள்ளன, அதனால் விவரங்கள் இழக்கப்படுகின்றன.",f_clip:"பிரகாசமான பகுதிகளைக் காக்க எக்ஸ்போஷரைக் குறையுங்கள், அல்லது நிழல் பகுதிகளை உயர்த்துங்கள்.",btnEnh:"புகைப்படத்தை தானாக மேம்படுத்து",enhT:"மேம்படுத்தப்பட்ட புகைப்படம்",enhBefore:"முன்",enhAfter:"பின்",enhDl:"மேம்படுத்திய புகைப்படத்தை பதிவிறக்கு",enhNote:"ஆட்டோ-இம்ப்ரூவ் வெளிச்சம், கான்ட்ராஸ்ட், நிறத்தைச் சரிசெய்யும். மங்கல் அல்லது குறைந்த ரெசொலூஷனைச் சரிசெய்ய முடியாது. பயன்படுத்தும் முன் இயல்பாகத் தெரிகிறதா என்று பாருங்கள்.",enhScore:"ஆட்டோ-இம்ப்ரூவுக்குப் பின் மதிப்பெண்",sWa:"உங்கள் விளம்பரத்துக்காக WhatsApp அமைக்கவும்",lWa:["உங்கள் தொழில் எண்ணில் WhatsApp Business ஆப்பை நிறுவுங்கள். தனிப்பட்ட WhatsApp-ல் இருந்து தனியாக வையுங்கள்.","தொழில் சுயவிவரத்தை நிரப்புங்கள்: பெயர், முகவரி, திறக்கும் நேரம், இணையதளம், சிறு விளக்கம்.","WhatsApp Business அமைப்புகளில் உங்கள் Facebook Page மற்றும் Instagram கணக்கை இணையுங்கள், அப்போது விளம்பரம் உங்கள் அரட்டையைத் திறக்கும்.","புதிய அரட்டைகளுக்கு வாழ்த்துச் செய்தியும் நேரத்துக்குப் பிறகு அனுப்ப அவே செய்தியும் அமையுங்கள்.","அடிக்கடி வரும் கேள்விகளுக்கு விரைவு பதில்களைச் சேமியுங்கள்: விலை, இடம், நேரம், டெலிவரி.","Ads Manager-ல் செய்தி இலக்காக WhatsApp-ஐத் தேர்ந்தெடுங்கள், முன்பே எழுதிய செய்தியையும் மக்கள் தொடக்கூடிய சில ஐஸ்-பிரேக்கர் கேள்விகளையும் சேருங்கள்.","பணம் செலவிடும் முன் வேறொரு போனில் இருந்து உங்கள் விளம்பரத்தைத் தொட்டு ஒரு செய்தி அனுப்பி அது வந்து சேர்கிறதா என்று பாருங்கள்.","ஒவ்வொரு அரட்டையையும் கண்காணிக்க லேபிள்களை (New, Paid, Follow up) பயன்படுத்துங்கள். சில நிமிடங்களில் பதில் அளியுங்கள்."],waNote:"ஒப்புதல் அளித்தவர்களுக்கு மட்டும் மொத்தச் செய்திகளை அனுப்புங்கள். தேவையற்ற மொத்தச் செய்திகளால் உங்கள் எண் தடை செய்யப்படலாம்.",tipsT:"இந்த இலக்குக்கான குறிப்புகள்",tip_aware:["சிறிய, கவனத்தை ஈர்க்கும் வீடியோவைப் பயன்படுத்துங்கள். முதல் 3 வினாடிகளே மக்கள் தொடர்ந்து பார்ப்பார்களா என்பதை முடிவு செய்கிறது.","மக்கள் நினைவில் வைத்திருக்க உங்கள் பெயர் அல்லது லோகோவை தொடக்கத்திலேயே காட்டுங்கள்.","இந்த இலக்கிலிருந்து மெசேஜ் அல்லது விற்பனையை எதிர்பார்க்காதீர்கள். ரீச்சும் மக்கள் உங்களை நினைவில் வைப்பதுமே வெற்றி."],tip_traffic:["மக்கள் முதலில் எங்கு செல்ல வேண்டும் (பக்கம், இணையதளம், WhatsApp அல்லது அழைப்பு) என்பதை முடிவு செய்து, அது போனில் சரியாக வேலை செய்கிறதா என்று பாருங்கள்.","கிளிக் செய்தால் என்ன கிடைக்கும் என்பதை கேப்ஷனிலும் வீடியோவிலும் சொல்லுங்கள்.","ஒரு கிளிக்கின் செலவைப் பாருங்கள். கிளிக் மலிவாக இருந்தும் யாரும் எதுவும் செய்யவில்லை என்றால், விளம்பரத்தை அல்ல, லேண்டிங் பக்கத்தை சரிசெய்யுங்கள்."],tip_engage:["வீடியோவை தெளிவான கோரிக்கையுடன் முடியுங்கள்: \"WhatsApp-ல் மெசேஜ் செய்யுங்கள்\".","ஒவ்வொரு மெசேஜுக்கும் சில நிமிடங்களில் பதில் அளியுங்கள். தாமதமானால் விளம்பரப் பணம் வீணாகும்.","விலை, இடம், நேரம் ஆகியவற்றுக்கு WhatsApp Business-ல் விரைவு பதில்களைச் சேமியுங்கள்."],tip_leads:["முடிந்தவரை குறைவாகக் கேளுங்கள் (பெயர், தொலைபேசி எண்). நீண்ட படிவம் மக்களை இழக்கச் செய்யும்.","பதிலுக்கு ஏதாவது கொடுங்கள்: இலவச மதிப்பீடு, சோதனை, தள்ளுபடி.","புதிய லீட்களை அதே நாளில் அழையுங்கள் அல்லது மெசேஜ் செய்யுங்கள். காத்திருந்தால் அவர்களின் ஆர்வம் குறைந்துவிடும்."],tip_app:["வீடியோவில் போன் திரையில் ஆப்பைக் காட்டி, அது என்ன செய்கிறது என்பதை ஒரு வரியில் சொல்லுங்கள்.","விளம்பரம் செய்யும் முன் ஆப் ஸ்டோர் பக்கத்தில் ஸ்கிரீன்ஷாட்களும் தெளிவான விளக்கமும் இருக்க வேண்டும்.","ஒரு நிறுவலின் செலவைப் பாருங்கள், பிறகு எத்தனை பேர் ஆப்பைத் திறக்கிறார்கள் என்றும் பாருங்கள்."],tip_sales:["செலவு செய்யும் முன் Meta Pixel நிறுவி ஒரு வாங்குதலைச் சோதியுங்கள், இல்லையெனில் வாங்குபவர்களை Meta கண்டுபிடிக்க முடியாது.","முதல் சில வினாடிகளில் பொருள், விலை, தெளிவான சலுகையைக் காட்டுங்கள்.","பொறுமையாக இருங்கள்: கற்க Meta-க்கு வாரத்துக்கு சுமார் 50 வாங்குதல்கள் தேவை, எனவே தொடர முடிந்த பட்ஜெட்டில் தொடங்குங்கள்."],g_aware:"விழிப்புணர்வு (Awareness)",d_aware:"அதிகபட்ச மக்களுக்கு விளம்பரத்தைக் காட்டி உங்களை அறியச் செய்யும். தொழிலோ பொருளோ புதிதாக இருந்தால் சிறந்தது.",g_traffic:"ட்ராஃபிக் (Traffic)",d_traffic:"மக்களை ஓர் இடத்துக்கு அனுப்பும்: உங்கள் Instagram பக்கம், இணையதளம், WhatsApp அல்லது தொலைபேசி அழைப்பு. மக்கள் நேரில் வர வேண்டுமெனில் நல்லது.",g_engage:"ஈடுபாடு (Engagement)",d_engage:"மக்கள் எதிர்வினையாற்ற, வீடியோவைப் பார்க்க, WhatsApp-ல் மெசேஜ் அனுப்ப உதவும். ஆர்வத்தையும் உரையாடல்களையும் பெருக்க நல்லது.",g_leads:"லீட்ஸ் (Leads)",d_leads:"படிவம், WhatsApp அல்லது அழைப்பு மூலம் ஆர்வமுள்ளவர்களின் பெயர், எண்ணை சேகரிக்கும். சேவைகளுக்கும் முன்பதிவுக்கும் நல்லது.",g_app:"ஆப் விளம்பரம் (App promotion)",d_app:"மக்கள் உங்கள் மொபைல் ஆப்பை நிறுவ வைக்கும். ஆப் உள்ள தொழில்களுக்கு மட்டும்.",g_sales:"விற்பனை (Sales)",d_sales:"மக்கள் உங்கள் இணையதளத்தில் அல்லது ஆப்பில் வாங்க உதவும். டிராக்கிங் அமைக்கப்பட்ட இணையதளம் தேவை.",gl_traffic:"எங்கள் பக்கத்தில் மேலும் பாருங்கள்",gl_engage:"WhatsApp-ல் மெசேஜ் செய்யுங்கள்",gl_leads:"உங்கள் விவரங்களைத் தாருங்கள், நாங்கள் அழைக்கிறோம்",gl_app:"ஆப்பை பதிவிறக்குங்கள்",gl_aware:"வந்து புதியதைப் பாருங்கள்",recL:"இந்தத் தொழிலுக்கு மிகப் பொருத்தமானது",aNote:"விழிப்புணர்வு இலக்கில் விளம்பரத்தை ரீச் மற்றும் 1,000 பேரை அடையும் செலவை வைத்து மதிப்பிடுங்கள், மெசேஜ் அல்லது விற்பனையை வைத்து அல்ல.",hgT:"இன்று இந்தியாவில் Google-ல் டிரெண்டிங்",tNote:"இவை Google தேடல்கள், Instagram ஹாஷ்டேக்குகள் அல்ல, பெரும்பாலும் செய்தி அல்லது விளையாட்டு தொடர்பானவை. உங்கள் தொழிலுக்கு உண்மையில் பொருந்தினால் மட்டும் பயன்படுத்துங்கள். துயரங்களையோ அரசியலையோ விளம்பரத்துடன் இணைக்காதீர்கள்.",tNone:"இன்றைய டிரெண்டுகளை ஏற்ற முடியவில்லை.",cpy:"நகலெடு",kGoal:"இலக்கு",kAud:"ஆடியன்ஸ்",kBud:"தினசரி பட்ஜெட்",kDur:"காலம்",kCnt:"உள்ளடக்கம்",kChk:"முதல் சோதனை",nDays:"{days} நாட்கள்",dayL:"நாள்",
sTl:"நாள்வாரி அட்டவணை",lTl:["கேம்பெயினை அமைத்து, பட்டன், இணைப்பு, கேப்ஷனை மீண்டும் சரிபார்த்து Publish செய்யுங்கள்.","எதையும் மாற்றாதீர்கள். Meta கற்றுக்கொள்ளட்டும். ஒவ்வொரு மெசேஜுக்கும் விரைவாக பதில் அளியுங்கள்.","முதல் சோதனை: ரீச், கிளிக், மெசேஜ். தெளிவாகத் தோல்வியடையும் விளம்பரத்தை நிறுத்துங்கள்.","ஒரே ஒன்றை மாற்றுங்கள் (ஹுக், ஆடியன்ஸ் அல்லது பட்டன்). சிறந்த விளம்பரத்தைத் தொடருங்கள்.","ஒரு முடிவுக்கான செலவு நன்றாக இருந்தால் பட்ஜெட்டை சுமார் 20% உயர்த்துங்கள். இல்லையெனில் புதிய வீடியோ அல்லது சலுகையை முயலுங்கள்."],
sCk:"வெளியிடும் முன் சரிபார்ப்பு பட்டியல்",lCk:["Instagram 'Professional' கணக்காக உள்ளது, Facebook Page-உடன் இணைக்கப்பட்டுள்ளது.","WhatsApp எண் அல்லது இணையதள இணைப்பு சரியானது (நீங்களே திறந்து பாருங்கள்).","கேப்ஷனில் எழுத்துப்பிழை இல்லை, சலுகை, விலை, இடம் சரியாக உள்ளன.","வீடியோ/புகைப்படம் தெளிவாகவும் பிரகாசமாகவும் சரியான வடிவத்திலும் உள்ளது.","கட்டண முறை சேர்க்கப்பட்டுள்ளது, முடிவு தேதி வைக்கப்பட்டுள்ளது."],
