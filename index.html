<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instagram Ad Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F5EF;--card:#FFFDF9;--ink:#1D1B16;--mut:#6A655B;--line:#DDD6C8;--pri:#1F5C4A;--prik:#FFFFFF;--soft:#E7EFE9;--ok:#1F7A4F;--bad:#B4421F;--warnbg:#FBEFD0;--warnk:#5A3E00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130F;--card:#1D1B16;--ink:#F2EEE4;--mut:#A9A294;--line:#38342B;--pri:#6FC2A0;--prik:#10201A;--soft:#22302A;--ok:#6FD39B;--bad:#F0916D;--warnbg:#3A2E10;--warnk:#FFE3A3}}
:root[data-theme="dark"]{--bg:#14130F;--card:#1D1B16;--ink:#F2EEE4;--mut:#A9A294;--line:#38342B;--pri:#6FC2A0;--prik:#10201A;--soft:#22302A;--ok:#6FD39B;--bad:#F0916D;--warnbg:#3A2E10;--warnk:#FFE3A3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hanken Grotesk","Noto Sans Malayalam","Noto Sans Devanagari","Noto Sans Tamil",system-ui,sans-serif}
main{max-width:660px;margin:0 auto;padding:22px 18px 60px}
h1,h2{font-family:"Fraunces","Noto Sans Malayalam","Noto Sans Devanagari","Noto Sans Tamil",Georgia,serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.15;margin:0 0 8px}
h2{font-size:22px;line-height:1.25;margin:0 0 6px}
h3{font-size:16px;margin:0 0 4px;font-weight:700}
h4{font-size:14px;margin:16px 0 4px;font-weight:700}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--pri);margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 14px;font-size:15px}
.langs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:16px 0 4px}
.langs button{padding:10px 0;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;color:var(--mut);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;min-height:44px}
.langs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--pri);font-weight:700}
.card{background:transparent;border:0;border-top:2px solid var(--ink);border-radius:0;padding:20px 0;margin:14px 0 0}
label.f{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
input[type=text],input[type=number],select{width:100%;min-height:46px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px}
input[type=file]{width:100%;padding:12px;border:1px dashed var(--mut);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
:is(input,select,button,a):focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;position:relative}
.chips input{position:absolute;opacity:0;width:0;height:0}
.chips span{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;font-size:15px}
.chips input:checked+span{background:var(--pri);border-color:var(--pri);color:var(--prik);font-weight:600}
.chips input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
.go{width:100%;min-height:50px;margin-top:22px;padding:12px;font-family:inherit;font-size:16px;font-weight:700;background:var(--pri);color:var(--prik);border:0;border-radius:6px;cursor:pointer}
.go:disabled{opacity:.6}
.btn{min-height:44px;padding:10px 16px;border:1px solid var(--ink);border-radius:6px;background:transparent;color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hide{display:none}
.sec{padding:16px 0;border-top:1px solid var(--line)}
.sec p,.sec ul,.sec ol{margin:4px 0;font-size:15px}.sec ul,.sec ol{padding-left:20px}
.big{background:var(--soft);border-radius:6px;padding:14px 16px;margin:12px 0;font-size:15px}
.big b{font-family:"Fraunces",Georgia,serif;font-size:28px;font-weight:600;color:var(--pri)}
.warn{background:var(--warnbg);color:var(--warnk);padding:10px 12px;border-radius:6px;margin:10px 0;font-size:14px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;font:inherit;font-size:15px;margin:6px 0}
.pv{display:flex;gap:6px;margin:10px 0;overflow-x:auto}.pv img{height:84px;border-radius:4px;border:1px solid var(--line)}
.score{display:flex;gap:12px;margin:14px 0}.score>div{flex:1;border:1px solid var(--line);border-radius:6px;padding:12px;font-size:14px;color:var(--mut);background:var(--card)}
.score b{font-family:"Fraunces",Georgia,serif;font-size:36px;font-weight:600;display:block;color:var(--ink);line-height:1.2}.score .up b{color:var(--ok)}
.bw{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 10px}.bw i{display:block;height:100%;background:var(--mut)}.bw.up i{background:var(--ok)}
.small{font-size:13px;color:var(--mut)}
.pos li::marker{color:var(--ok)}.neg li::marker{color:var(--bad)}
.kv{list-style:none;padding:0;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv li{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:15px;font-weight:600}
.kv b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:2px}
.sec ul.ck{list-style:none;padding-left:0}.sec ul.ck li{margin:6px 0}
.sec .tl{list-style:none;padding-left:0}.tl li{display:flex;gap:10px;margin:10px 0}
.dy{flex:none;min-width:70px;text-align:center;background:var(--soft);color:var(--pri);font-weight:700;font-size:13px;border-radius:4px;padding:3px 6px;height:fit-content}
</style>
</head>
<body>
<main>
<header>
<p class="brand" id="brandL"></p>
<h1 data-i="brand"></h1>
<p class="sub" data-i="sub"></p>
<div class="langs" role="group" aria-label="Language">
<button type="button" data-l="en" aria-pressed="true">English</button>
<button type="button" data-l="ml" aria-pressed="false">മലയാളം</button>
<button type="button" data-l="hi" aria-pressed="false">हिन्दी</button>
<button type="button" data-l="ta" aria-pressed="false">தமிழ்</button>
</div>
</header>

<section class="card" id="qc">
<h2 data-i="step1"></h2>
<p class="sub" data-i="step1s"></p>
<input id="fl" type="file" accept="image/*,video/*">
<div id="pv" class="pv"></div>
<button class="go" id="chk" type="button" data-i="check"></button>
<p id="qn" class="small"></p>
<div id="qo" aria-live="polite"></div>
</section>

<section class="card">
<h2 data-i="step2"></h2>
<form id="f" onsubmit="return false">
<label class="f" for="biz" data-i="biz"></label>
<input type="text" id="biz" data-p="bizPh" autocomplete="off">
<label class="f" for="item" data-i="item"></label>
<input type="text" id="item" data-p="itemPh" autocomplete="off">
<label class="f" for="type" data-i="type"></label>
<select id="type">
<option value="food" data-i="t_food"></option><option value="fashion" data-i="t_fashion"></option><option value="beauty" data-i="t_beauty"></option><option value="shop" data-i="t_shop"></option><option value="service" data-i="t_service"></option>
</select>
<label class="f" data-i="media"></label>
<div class="chips">
<label><input type="radio" name="media" value="video" checked><span data-i="m_video"></span></label>
<label><input type="radio" name="media" value="photo"><span data-i="m_photo"></span></label>
<label><input type="radio" name="media" value="both"><span data-i="m_both"></span></label>
</div>
<label class="f" data-i="goal"></label>
<div class="chips" id="goal">
<label><input type="radio" name="goal" value="msg" checked><span data-i="g_msg"></span></label>
<label><input type="radio" name="goal" value="visit"><span data-i="g_visit"></span></label>
<label><input type="radio" name="goal" value="sales"><span data-i="g_sales"></span></label>
<label><input type="radio" name="goal" value="follow"><span data-i="g_follow"></span></label>
</div>
<label class="f" for="place" data-i="place"></label>
<input type="text" id="place" data-p="placePh" autocomplete="off">
<label class="f" for="area" data-i="area"></label>
<select id="area">
<option value="local" data-i="a_local"></option><option value="district" data-i="a_district"></option><option value="state" data-i="a_state"></option><option value="india" data-i="a_india"></option>
</select>
<label class="f" data-i="mode"></label>
<div class="chips">
<label><input type="radio" name="mode" value="new" checked><span data-i="md_new"></span></label>
<label><input type="radio" name="mode" value="pro"><span data-i="md_pro"></span></label>
</div>
<div id="pro" class="hide">
<div class="row">
<div><label class="f" for="aov" data-i="aov"></label><input id="aov" type="number" inputmode="numeric" placeholder="800"></div>
<div><label class="f" for="mg" data-i="mg"></label><input id="mg" type="number" inputmode="numeric" placeholder="40"></div>
</div>
<label class="f" for="list" data-i="list"></label>
<select id="list"><option value="no" data-i="l_no"></option><option value="yes" data-i="l_yes"></option></select>
</div>
<div class="row">
<div><label class="f" for="bud" data-i="bud"></label><input id="bud" type="number" inputmode="numeric" min="50" value="200"></div>
<div><label class="f" for="days" data-i="days"></label><input id="days" type="number" inputmode="numeric" min="1" max="60" value="7"></div>
</div>
<button class="go" id="make" type="button" data-i="make"></button>
</form>
</section>

<section class="card hide" id="plan" aria-live="polite"></section>
</main>

sp:"How ad payments work",lp:["Ad spend is paid to Meta through the advertiser's own payment method: UPI, card or net banking, depending on the account.","You're charged only as the ad runs. ₹{total} is the maximum if you set an end date.","Accounts can be prepaid (add money first) or postpaid (billed later). The ad won't run until a payment method is added.","GST may be added to the bill, so treat it as extra on top of your ad budget.","Receipts are under Ads Manager → Billing."],
se:"How you earn from client work",le:["Ad spend is not your income. The client pays it directly to Meta.","Your income is a service fee: a fixed setup fee, or a monthly management fee.","Quote the ad budget and your fee separately: \"Ad budget ₹{total} goes to Meta, my fee is separate.\"","Ask the client to add you as a partner or admin in their account. Never hold their card or UPI.","Share a short report after the first 7 days (reach, messages, cost). Never promise results."],

s7:"Ads Manager-ൽ ഘട്ടം ഘട്ടമായി സെറ്റ് ചെയ്യാം",l7:["Facebook Page ഉണ്ടാക്കുക, Instagram 'Professional' അക്കൗണ്ടാക്കി ആ Page-മായി ബന്ധിപ്പിക്കുക.","Instagram-ൽ റീലോ ഫോട്ടോയോ പോസ്റ്റ് ചെയ്ത് Boost അമർത്തുക, അല്ലെങ്കിൽ business.facebook.com → Ads Manager → Create.","മുകളിലെ ലക്ഷ്യം തിരഞ്ഞെടുക്കുക.","ഓഡിയൻസ് സെറ്റ് ചെയ്യുക: സ്ഥലം, പ്രായം, താൽപ്പര്യങ്ങൾ.","Placements തിരഞ്ഞെടുക്കുക.","ദിവസ ബജറ്റ് ₹{bud}, {days} ദിവസം കഴിഞ്ഞ് അവസാന തീയതി നൽകുക.","നിങ്ങളുടെ പോസ്റ്റ് പരസ്യമായി തിരഞ്ഞെടുത്ത് ബട്ടൺ {cta} ആക്കുക.","പേയ്‌മെന്റ് രീതി (UPI അല്ലെങ്കിൽ കാർഡ്) ചേർത്ത് Publish അമർത്തുക."],s7n:"പരസ്യം റിവ്യൂ ചെയ്യാൻ ഒരു ദിവസം വരെ എടുക്കാം.",
s8:"3–4 ദിവസത്തിന് ശേഷം എന്ത് ചെയ്യണം",l8:["ആദ്യ 2 ദിവസം ഒന്നും മാറ്റരുത്. Meta ഇപ്പോഴും പഠിക്കുകയാണ്.","മെസ്സേജുകളോ ഫലങ്ങളോ വരുന്നുണ്ടെങ്കിൽ ബജറ്റ് ഏകദേശം 20% കൂട്ടുക.","ആളുകൾ പരസ്യം കാണുന്നുണ്ട് പക്ഷേ ക്ലിക്കോ മെസ്സേജോ ഇല്ലെങ്കിൽ വീഡിയോയുടെ ആദ്യ 3 സെക്കൻഡോ ബട്ടണോ മാറ്റുക.","ആരും കാണുന്നില്ലെങ്കിൽ സ്ഥലമോ പ്രായപരിധിയോ വിശാലമാക്കുക, അല്ലെങ്കിൽ ബജറ്റ് കൂട്ടുക.","ഒരു സമയം ഒരു കാര്യം മാത്രം മാറ്റുക."],
sp:"പരസ്യത്തിന്റെ പണം എങ്ങനെ അടയ്ക്കും",lp:["പരസ്യച്ചെലവ് Meta-ക്ക് നൽകുന്നത് പരസ്യം ചെയ്യുന്ന ആളുടെ സ്വന്തം പേയ്‌മെന്റ് രീതിയിലൂടെയാണ്: UPI, കാർഡ് അല്ലെങ്കിൽ നെറ്റ് ബാങ്കിംഗ് (അക്കൗണ്ട് അനുസരിച്ച്).","പരസ്യം ഓടുന്നതിനനുസരിച്ച് മാത്രമേ പണം പോകൂ. അവസാന തീയതി നൽകിയാൽ ₹{total} ആണ് പരമാവധി.","അക്കൗണ്ട് പ്രീപെയ്ഡ് (ആദ്യം പണം ചേർക്കണം) അല്ലെങ്കിൽ പോസ്റ്റ്പെയ്ഡ് (പിന്നീട് ബിൽ) ആകാം. പേയ്‌മെന്റ് രീതി ചേർക്കുന്നത് വരെ പരസ്യം ഓടില്ല.","ബില്ലിൽ GST കൂടി ചേർന്നേക്കാം, പരസ്യ ബജറ്റിന് പുറമെയുള്ള ചെലവായി കണക്കാക്കുക.","രസീതുകൾ Ads Manager → Billing-ൽ ലഭിക്കും."],
se:"ക്ലയന്റ് ജോലിയിൽ നിങ്ങൾക്ക് എങ്ങനെ വരുമാനം",le:["പരസ്യച്ചെലവ് നിങ്ങളുടെ വരുമാനമല്ല. ക്ലയന്റ് അത് നേരിട്ട് Meta-ക്ക് നൽകണം.","നിങ്ങളുടെ വരുമാനം സർവീസ് ഫീ ആണ്: ഒറ്റത്തവണ സെറ്റപ്പ് ഫീ, അല്ലെങ്കിൽ പ്രതിമാസ മാനേജ്മെന്റ് ഫീ.","പരസ്യ ബജറ്റും ഫീസും വെവ്വേറെ പറയുക: \"പരസ്യ ബജറ്റ് ₹{total} Meta-ക്ക്, എന്റെ ഫീ വേറെ.\"","ക്ലയന്റിന്റെ അക്കൗണ്ടിൽ നിങ്ങളെ പാർട്ണറോ അഡ്മിനോ ആയി ചേർക്കാൻ പറയുക. അവരുടെ കാർഡോ UPI-യോ കൈവശം വയ്ക്കരുത്.","ആദ്യ 7 ദിവസത്തിന് ശേഷം ചെറിയ റിപ്പോർട്ട് നൽകുക (റീച്ച്, മെസ്സേജുകൾ, ചെലവ്). ഫലം ഒരിക്കലും വാഗ്ദാനം ചെയ്യരുത്."],

w1:"தினமும் ₹150–200-க்கு குறைவாக இருந்தால் யார் பதிலளிக்கிறார்கள் என்பதை Meta கற்றுக்கொள்ள சிரமப்படும். முடிந்தால் ₹200 ஆக்கவும்.",w2:"விளம்பரம் கற்றுக்கொள்ள நேரம் கிடைக்க குறைந்தது 5–7 நாட்கள் ஓட்டவும்.",proNote:"மேம்பட்ட திட்டம் ஆங்கிலத்தில் மட்டுமே உள்ளது.",
s1:"விளம்பர இலக்கு (Ads Manager-ல் தேர்ந்தெடுக்க வேண்டியது)",s2:"உங்கள் விளம்பரத்தை யார் பார்ப்பார்கள்",loc:"இடம்",age:"வயது",gen:"பாலினம்",int:"ஆர்வங்கள்",gAll:"அனைவரும்",gW:"பெரும்பாலும் பெண்கள்",
aud2:"இந்த பட்ஜெட்டில் இரண்டு ஆடியன்ஸ்களை சோதிக்கலாம்: (A) மேலே உள்ள ஆர்வங்கள், (B) ஆர்வங்கள் இல்லாத பரந்த ஆடியன்ஸ். 3 நாட்களுக்குப் பிறகு சிறந்ததை வைத்துக்கொள்ளுங்கள்.",aud1:"இந்த பட்ஜெட்டில் ஒரே ஆடியன்ஸ் போதும். பிரித்தால் இரண்டும் மெதுவாகவே கற்கும்.",
s3:"உங்கள் விளம்பரம் எங்கே தோன்றும்",pPhoto:"Feed (4:5 புகைப்படம்), Stories, Explore. புகைப்படங்களை விட குறுகிய வீடியோக்கள் பொதுவாக நன்றாக செயல்படும்.",pVideo:"Reels, Stories, Feed. செங்குத்தாக (9:16) 15–30 வினாடிகள் எடுக்கவும்.",pBoth:"வீடியோவுக்கு Reels, புகைப்படத்துக்கு Feed. இரண்டையும் ஓட்டினால் எது சிறந்தது என்பதை Meta காட்டும்.",pAuto:"Advantage+ placements (தானியங்கி) மூலம் தொடங்குங்கள்.",
s4:"உங்கள் உள்ளடக்கம் எப்படி இருக்க வேண்டும்",hk_food:"முதல் 2 வினாடிகளில் உணவின் க்ளோஸ்-அப் காட்டுங்கள் (ஆவி, சீஸ், கேக் வெட்டுதல்).",hk_fashion:"முதல் 3 வினாடிகளில் ஆடையை அணிந்து திரும்புவதைக் காட்டுங்கள்.",hk_beauty:"பிஃபோர்/ஆஃப்டர் காட்சியுடன் தொடங்குங்கள்.",hk_shop:"முதல் 3 வினாடிகளில் பொருளை பயன்படுத்துவதைக் காட்டுங்கள்.",hk_service:"முதலில் பிரச்சனை, 3 வினாடிகளுக்குள் உங்கள் தீர்வைக் காட்டுங்கள்.",
k1:"எழுத்து குறைவாக வையுங்கள், ஒலி இல்லாவிட்டாலும் புரிய வேண்டும்.",k2:"இறுதியில் உங்கள் சலுகை அல்லது பட்டனைக் காட்டுங்கள்: {cta}.",
s5:"கேப்ஷன் மற்றும் ஹாஷ்டேக்",btnL:"பட்டன்",tagTip:"5–8 ஹாஷ்டேக் போதும். கட்டண ரீச்சை அதிகரிப்பது ஹாஷ்டேக் அல்ல, டார்கெட்டிங்.",
s6:"விளம்பரம் ஓட்ட சிறந்த நேரம்",w_food:"மதியம் 11–1, மாலை 6–9",w_other:"மாலை 6–9, வார இறுதிகளிலும்",s6n:"அட்டவணையை 24 மணி நேரமும் இயக்கத்தில் வைக்கலாம், சிறந்த நேரத்தை Meta கண்டுபிடிக்கும்.",
s7:"Ads Manager-ல் படிப்படியாக அமைக்க",l7:["Facebook Page உருவாக்கி, Instagram-ஐ 'Professional' கணக்காக மாற்றி அந்த Page-உடன் இணைக்கவும்.","Instagram-ல் ரீல் அல்லது புகைப்படத்தை பதிவிட்டு Boost அழுத்தவும், அல்லது business.facebook.com → Ads Manager → Create திறக்கவும்.","மேலே உள்ள இலக்கைத் தேர்ந்தெடுக்கவும்.","ஆடியன்ஸை அமைக்கவும்: இடம், வயது, ஆர்வங்கள்.","Placements தேர்ந்தெடுக்கவும்.","தினசரி பட்ஜெட் ₹{bud}, {days} நாட்களுக்குப் பிறகு முடிவு தேதி வையுங்கள்.","உங்கள் பதிவை விளம்பரமாகத் தேர்ந்தெடுத்து பட்டனை {cta} என வையுங்கள்.","கட்டண முறையை (UPI அல்லது கார்டு) சேர்த்து Publish அழுத்தவும்."],s7n:"விளம்பர மதிப்பாய்வுக்கு ஒரு நாள் வரை ஆகலாம்.",
s8:"3–4 நாட்களுக்குப் பிறகு என்ன செய்ய வேண்டும்",l8:["முதல் 2 நாட்கள் எதையும் மாற்றாதீர்கள். Meta இன்னும் கற்றுக்கொண்டிருக்கிறது.","மெசேஜ்கள் அல்லது முடிவுகள் வந்தால் பட்ஜெட்டை சுமார் 20% உயர்த்துங்கள்.","மக்கள் விளம்பரத்தைப் பார்த்தும் கிளிக் அல்லது மெசேஜ் செய்யவில்லை என்றால் வீடியோவின் முதல் 3 வினாடிகள் அல்லது பட்டனை மாற்றுங்கள்.","கிட்டத்தட்ட யாரும் பார்க்கவில்லை என்றால் இடம் அல்லது வயது வரம்பை விரிவாக்குங்கள், அல்லது பட்ஜெட்டை உயர்த்துங்கள்.","ஒரு நேரத்தில் ஒரே ஒன்றை மட்டும் மாற்றுங்கள்."],
sp:"விளம்பரப் பணம் எப்படி செலுத்தப்படும்",lp:["விளம்பரச் செலவு Meta-க்கு விளம்பரதாரரின் சொந்த கட்டண முறையில் செலுத்தப்படும்: UPI, கார்டு அல்லது நெட் பேங்கிங் (கணக்கைப் பொறுத்து).","விளம்பரம் ஓடும் அளவுக்கு மட்டுமே பணம் கழியும். முடிவு தேதி வைத்தால் ₹{total} அதிகபட்சம்.","கணக்கு ப்ரீபெய்டு (முதலில் பணம் சேர்க்க) அல்லது போஸ்ட்பெய்டு (பின்னர் பில்) ஆகலாம். கட்டண முறை சேர்க்கும் வரை விளம்பரம் ஓடாது.","பில்லில் GST சேரலாம், விளம்பர பட்ஜெட்டுக்கு மேல் கூடுதல் செலவாகக் கருதுங்கள்.","ரசீதுகள் Ads Manager → Billing-ல் கிடைக்கும்."],
se:"வாடிக்கையாளர் வேலையில் உங்களுக்கு எப்படி வருமானம்",le:["விளம்பரச் செலவு உங்கள் வருமானம் அல்ல. வாடிக்கையாளர் அதை நேரடியாக Meta-க்கு செலுத்துவார்.","உங்கள் வருமானம் சேவைக் கட்டணம்: ஒருமுறை செட்டப் கட்டணம், அல்லது மாதாந்திர மேலாண்மைக் கட்டணம்.","விளம்பர பட்ஜெட்டையும் உங்கள் கட்டணத்தையும் தனித்தனியாகச் சொல்லுங்கள்: \"விளம்பர பட்ஜெட் ₹{total} Meta-க்கு, என் கட்டணம் தனி.\"","வாடிக்கையாளரின் கணக்கில் உங்களை பார்ட்னர் அல்லது அட்மினாகச் சேர்க்கச் சொல்லுங்கள். அவர்களின் கார்டு அல்லது UPI-ஐ உங்களிடம் வைத்திருக்காதீர்கள்.","முதல் 7 நாட்களுக்குப் பிறகு சிறு அறிக்கை கொடுங்கள் (ரீச், மெசேஜ், செலவு). முடிவுகளுக்கு ஒருபோதும் உறுதி கூறாதீர்கள்."],

n_dark:"மிகவும் இருட்டாக உள்ளது, விவரங்கள் இழக்கப்படுகின்றன.",n_bright:"வெளிச்சம் அதிகம், சில பகுதிகள் வெளுத்துவிட்டன.",n_con:"மங்கலாகவும் தட்டையாகவும் உள்ளது, கான்ட்ராஸ்ட் குறைவு.",n_sharp:"மங்கலாக உள்ளது அல்லது ஃபோகஸ் தவறியுள்ளது.",n_res:"ரெசொலூஷன் குறைவு, பிக்சல்கள் தெரியும்.",n_fmt:"Instagram-க்கு ஏற்ற வடிவம் அல்ல.",n_short:"வீடியோ மிகக் குறுகியது (5 வினாடிக்கு குறைவு).",n_long:"வீடியோ நீளமானது (60 வினாடிக்கு மேல்). குறுகிய வீடியோக்களை அதிகம் பேர் பார்ப்பார்கள்.",
f_dark:"ஜன்னல் அருகில் அல்லது பகல் வெளிச்சத்தில் எடுங்கள், அல்லது பிரைட்னஸை சிறிது கூட்டுங்கள்.",f_bright:"நேரடி வெயிலில் இருந்து விலகுங்கள் அல்லது எக்ஸ்போஷரைக் குறையுங்கள்.",f_con:"எடிட் செய்யும்போது கான்ட்ராஸ்ட் மற்றும் சாச்சுரேஷனை சிறிது கூட்டுங்கள்.",f_sharp:"ஃபோகஸ் செய்ய திரையைத் தொடுங்கள், போனை நிலையாகப் பிடியுங்கள், லென்ஸைத் துடையுங்கள். தேவைப்பட்டால் மீண்டும் எடுங்கள்.",f_res:"1080p அல்லது அதற்கு மேல் எடுங்கள்; ஸ்கிரீன்ஷாட் அல்லது ஃபார்வர்டு செய்த படத்தைப் பயன்படுத்தாதீர்கள்.",f_fmt:"Reels/Stories-க்கு செங்குத்து 9:16, Feed-க்கு 4:5 பயன்படுத்துங்கள்.",f_len:"15–30 வினாடிகள் போதும், முதல் 3 வினாடிகளை வலுவாக்குங்கள்.",
v_good:"பயன்படுத்தத் தயார். சிறு மேம்பாடுகள் இன்னும் உதவும்.",v_mid:"பயன்படுத்தலாம், ஆனால் கீழே உள்ளவற்றை சரிசெய்தால் மேம்படும்.",v_bad:"விளம்பரத்துக்கு பணம் செலவிடும் முன் இதை மேம்படுத்த வேண்டும்.",none:"பெரிய குறைகள் இல்லை.",

sCk:"Pre-launch checklist",lCk:["Instagram is a Professional account linked to your Facebook Page.","WhatsApp number or website link is correct (test it yourself).","Caption is proofread; offer, price and place are accurate.","Video or photo is sharp, bright and in the right format.","Payment method is added and the end date is set."],

ml:{hgT:"ഇന്ന് ഇന്ത്യയിൽ Google-ൽ ട്രെൻഡിംഗ്",tNote:"ഇവ Google തിരച്ചിലുകളാണ്, Instagram ഹാഷ്ടാഗുകളല്ല, പലപ്പോഴും വാർത്തയോ കായികമോ ആയിരിക്കും. നിങ്ങളുടെ ബിസിനസ്സിന് ശരിക്കും ചേരുന്നതാണെങ്കിൽ മാത്രം ഉപയോഗിക്കുക. ദുരന്തങ്ങളെയോ രാഷ്ട്രീയത്തെയോ പരസ്യത്തോട് ചേർക്കരുത്.",tNone:"ഇന്നത്തെ ട്രെൻഡുകൾ ലോഡ് ചെയ്യാനായില്ല.",cpy:"കോപ്പി",kGoal:"ലക്ഷ്യം",kAud:"ഓഡിയൻസ്",kBud:"ദിവസ ബജറ്റ്",kDur:"കാലാവധി",kCnt:"കണ്ടന്റ്",kChk:"ആദ്യ പരിശോധന",nDays:"{days} ദിവസം",dayL:"ദിവസം",
sTl:"ദിവസം തോറുമുള്ള ഷെഡ്യൂൾ",lTl:["കാമ്പെയ്ൻ സെറ്റ് ചെയ്യുക, ബട്ടൺ, ലിങ്ക്, ക്യാപ്ഷൻ ഒന്നുകൂടി നോക്കി Publish ചെയ്യുക.","ഒന്നും ചെയ്യരുത്. Meta പഠിക്കട്ടെ. എല്ലാ മെസ്സേജിനും വേഗം മറുപടി നൽകുക.","ആദ്യ പരിശോധന: റീച്ച്, ക്ലിക്ക്, മെസ്സേജ്. വ്യക്തമായി പരാജയപ്പെടുന്ന പരസ്യം നിർത്തുക.","ഒരു കാര്യം മാത്രം മാറ്റുക (ഹുക്ക്, ഓഡിയൻസ് അല്ലെങ്കിൽ ബട്ടൺ). ഏറ്റവും മികച്ച പരസ്യം ഓടിക്കുക.","ഒരു റിസൾട്ടിന്റെ ചെലവ് നല്ലതാണെങ്കിൽ ബജറ്റ് ഏകദേശം 20% കൂട്ടുക. അല്ലെങ്കിൽ പുതിയ വീഡിയോയോ ഓഫറോ പരീക്ഷിക്കുക."],
sCk:"പബ്ലിഷ് ചെയ്യുംമുമ്പ് പരിശോധിക്കാൻ",lCk:["Instagram 'Professional' അക്കൗണ്ടാണ്, Facebook Page-മായി ബന്ധിപ്പിച്ചിട്ടുണ്ട്.","WhatsApp നമ്പറോ വെബ്സൈറ്റ് ലിങ്കോ ശരിയാണ് (സ്വയം തുറന്ന് നോക്കുക).","ക്യാപ്ഷനിൽ അക്ഷരത്തെറ്റില്ല, ഓഫർ, വില, സ്ഥലം എന്നിവ ശരിയാണ്.","വീഡിയോ/ഫോട്ടോ വ്യക്തവും തെളിച്ചമുള്ളതും ശരിയായ ഫോർമാറ്റിലുമാണ്.","പേയ്‌മെന്റ് രീതി ചേർത്തിട്ടുണ്ട്, അവസാന തീയതി നൽകിയിട്ടുണ്ട്."],
sKp:"ആഴ്ചതോറുമുള്ള റിപ്പോർട്ട് കാർഡ്",lKp:["റീച്ച്|എത്ര വ്യത്യസ്ത ആളുകൾ പരസ്യം കണ്ടു. ദിവസവും കൂടിവരണം.","ഒരു റിസൾട്ടിന്റെ ചെലവ്|ഒരു മെസ്സേജ്, ക്ലിക്ക് അല്ലെങ്കിൽ ഓർഡറിന് എത്ര ചെലവായി. കുറയുന്നതാണ് നല്ലത്.","CTR (ക്ലിക്ക് നിരക്ക്)|കണ്ടവരിൽ ക്ലിക്ക് ചെയ്തവരുടെ ശതമാനം. ഏകദേശം 1% അതിൽ കൂടുതൽ നല്ല ലക്ഷണം.","ഫ്രീക്വൻസി|ഒരാൾ പരസ്യം എത്ര തവണ കണ്ടു. ഒരാഴ്ച 3-ൽ കൂടിയാൽ വീഡിയോ മാറ്റുക."],
capMain:"നിങ്ങളുടെ ക്യാപ്ഷൻ (പോസ്റ്റ് ചെയ്യാൻ തയ്യാർ)",capRef:"മാതൃകാ ക്യാപ്ഷനുകൾ (വാക്കുകൾ നിങ്ങൾക്കനുസരിച്ച് മാറ്റുക)",cs1:"ഓഫർ",cs2:"കഥ",cs3:"ചോദ്യം",cs4:"വിശ്വാസം",
c1:"{biz}-ൽ പുതിയത്: {item}.\n{place}-ൽ ലഭ്യമാണ്.\n{line}.",c2:"{item} ശരിയായ രീതിയിൽ, ഓരോ ഉപഭോക്താവിനും വേണ്ടി നൽകാനാണ് ഞങ്ങൾ {biz} തുടങ്ങിയത്.\nനിങ്ങൾ {place}-ലാണെങ്കിൽ നേരിട്ട് വന്ന് കാണൂ.\n{line}.",c3:"{place}-ൽ {item} വേണമെങ്കിൽ നിങ്ങൾ എവിടെ പോകും?\nഒരു തവണ {biz} പരീക്ഷിച്ച് അഭിപ്രായം പറയൂ.\n{line}.",c4:"{place}-ലെ ഉപഭോക്താക്കൾ {item}-ന് വേണ്ടി വീണ്ടും വീണ്ടും {biz}-ൽ വരുന്നു.\nകാരണം അറിയൂ.\n{line}.",
hgR:"ശുപാർശ ചെയ്യുന്ന സെറ്റ് (ഇത് കോപ്പി ചെയ്യുക)",hgB:"വിശാലം (കൂടുതൽ ആളുകളിലേക്ക്)",hgN:"നിങ്ങളുടെ വിഭാഗം",hgL:"നിങ്ങളുടെ പ്രദേശം",tagTip:"പ്രസക്തമായ 3–10 ഹാഷ്ടാഗ് മതി. ഹാഷ്ടാഗ് പരിധികൾ മാറാം, പോസ്റ്റ് ചെയ്യുമ്പോൾ പരിശോധിക്കുക. പണം കൊടുത്തുള്ള റീച്ച് കൂട്ടുന്നത് ടാർഗെറ്റിംഗാണ്.",capNote:"നിങ്ങളുടെ ശൈലിക്ക് അനുസരിച്ച് വാക്കുകൾ മാറ്റുക. ഓഫർ ആദ്യ വരിയിൽ വയ്ക്കുക."},
hi:{hgT:"आज भारत में Google पर ट्रेंडिंग",tNote:"ये Google की सर्च हैं, Instagram हैशटैग नहीं, और अक्सर ख़बर या खेल की होती हैं। इनमें से तभी चुनें जब सच में आपके बिज़नेस से जुड़ती हो। हादसों या राजनीति को विज्ञापन से कभी न जोड़ें।",tNone:"आज के ट्रेंड लोड नहीं हो सके।",cpy:"कॉपी",kGoal:"लक्ष्य",kAud:"ऑडियंस",kBud:"रोज़ का बजट",kDur:"अवधि",kCnt:"कंटेंट",kChk:"पहली जाँच",nDays:"{days} दिन",dayL:"दिन",
sTl:"दिन-दर-दिन शेड्यूल",lTl:["कैंपेन सेट करें, बटन, लिंक और कैप्शन दोबारा जाँचें, फिर Publish करें।","कुछ न करें। Meta को सीखने दें। हर मैसेज का जल्दी जवाब दें।","पहली जाँच: रीच, क्लिक और मैसेज। साफ़ तौर पर फ़ेल हो रहे विज्ञापन को रोकें।","एक ही चीज़ बदलें (हुक, ऑडियंस या बटन)। सबसे अच्छा विज्ञापन चलाते रहें।","अगर हर रिज़ल्ट की लागत अच्छी है तो बजट लगभग 20% बढ़ाएँ। नहीं तो नया वीडियो या ऑफ़र आज़माएँ।"],
sCk:"पब्लिश करने से पहले की चेकलिस्ट",lCk:["Instagram 'Professional' अकाउंट है और Facebook Page से जुड़ा है।","WhatsApp नंबर या वेबसाइट लिंक सही है (खुद खोलकर देखें)।","कैप्शन में कोई ग़लती नहीं है, ऑफ़र, क़ीमत और जगह सही हैं।","वीडियो/फ़ोटो साफ़, चमकदार और सही फ़ॉर्मैट में है।","पेमेंट तरीका जुड़ा है और अंतिम तारीख डाली गई है।"],
sKp:"साप्ताहिक रिपोर्ट कार्ड",lKp:["रीच|कितने अलग-अलग लोगों ने विज्ञापन देखा। यह रोज़ बढ़ना चाहिए।","हर रिज़ल्ट की लागत|एक मैसेज, क्लिक या ऑर्डर पर कितना खर्च हुआ। कम होना बेहतर है।","CTR (क्लिक दर)|देखने वालों में से कितनों ने क्लिक किया। लगभग 1% या ज़्यादा अच्छा संकेत है।","फ़्रीक्वेंसी|एक व्यक्ति ने विज्ञापन कितनी बार देखा। हफ़्ते में 3 से ऊपर हो तो वीडियो बदलें।"],

hgR:"सुझाया गया सेट (इसे कॉपी करें)",hgB:"चौड़े (ज़्यादा लोगों तक)",hgN:"आपकी कैटेगरी",hgL:"आपका इलाक़ा",tagTip:"काम के 3–10 हैशटैग काफ़ी हैं। हैशटैग की सीमाएँ बदल सकती हैं, पोस्ट करते समय देख लें। पेड रीच टार्गेटिंग से बढ़ती है।",capNote:"अपने अंदाज़ के हिसाब से शब्द बदलें। ऑफ़र पहली लाइन में रखें।"},
ta:{hgT:"இன்று இந்தியாவில் Google-ல் டிரெண்டிங்",tNote:"இவை Google தேடல்கள், Instagram ஹாஷ்டேக்குகள் அல்ல, பெரும்பாலும் செய்தி அல்லது விளையாட்டு தொடர்பானவை. உங்கள் தொழிலுக்கு உண்மையில் பொருந்தினால் மட்டும் பயன்படுத்துங்கள். துயரங்களையோ அரசியலையோ விளம்பரத்துடன் இணைக்காதீர்கள்.",tNone:"இன்றைய டிரெண்டுகளை ஏற்ற முடியவில்லை.",cpy:"நகலெடு",kGoal:"இலக்கு",kAud:"ஆடியன்ஸ்",kBud:"தினசரி பட்ஜெட்",kDur:"காலம்",kCnt:"உள்ளடக்கம்",kChk:"முதல் சோதனை",nDays:"{days} நாட்கள்",dayL:"நாள்",
sTl:"நாள்வாரி அட்டவணை",lTl:["கேம்பெயினை அமைத்து, பட்டன், இணைப்பு, கேப்ஷனை மீண்டும் சரிபார்த்து Publish செய்யுங்கள்.","எதையும் மாற்றாதீர்கள். Meta கற்றுக்கொள்ளட்டும். ஒவ்வொரு மெசேஜுக்கும் விரைவாக பதில் அளியுங்கள்.","முதல் சோதனை: ரீச், கிளிக், மெசேஜ். தெளிவாகத் தோல்வியடையும் விளம்பரத்தை நிறுத்துங்கள்.","ஒரே ஒன்றை மாற்றுங்கள் (ஹுக், ஆடியன்ஸ் அல்லது பட்டன்). சிறந்த விளம்பரத்தைத் தொடருங்கள்.","ஒரு முடிவுக்கான செலவு நன்றாக இருந்தால் பட்ஜெட்டை சுமார் 20% உயர்த்துங்கள். இல்லையெனில் புதிய வீடியோ அல்லது சலுகையை முயலுங்கள்."],

/* local quality check */
function clp(x){return Math.max(0,Math.min(100,Math.round(x)))}
function big(src,w,h){var m=Math.min(1,768/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*m);c.height=Math.round(h*m);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.8)}
function stat(src,w,h){var m=Math.min(1,256/Math.max(w,h)),cw=Math.max(8,Math.round(w*m)),ch=Math.max(8,Math.round(h*m)),c=document.createElement("canvas");c.width=cw;c.height=ch;var x=c.getContext("2d");x.drawImage(src,0,0,cw,ch);
var d=x.getImageData(0,0,cw,ch).data,g=new Float32Array(cw*ch),s=0,i,j;
for(i=0,j=0;i<d.length;i+=4,j++){g[j]=.299*d[i]+.587*d[i+1]+.114*d[i+2];s+=g[j]}
var mean=s/g.length,v=0;for(j=0;j<g.length;j++)v+=(g[j]-mean)*(g[j]-mean);
var lv=0,n=0;for(var yy=1;yy<ch-1;yy++)for(var xx=1;xx<cw-1;xx++){var p=yy*cw+xx,l=4*g[p]-g[p-1]-g[p+1]-g[p-cw]-g[p+cw];lv+=l*l;n++}
return{m:mean,sd:Math.sqrt(v/g.length),lap:lv/Math.max(1,n),th:c.toDataURL("image/jpeg",.7),bg:AI_URL?big(src,w,h):""}}
function avg(a,k){return a.reduce(function(s,x){return s+x[k]},0)/a.length}
function scoreOf(a,w,h){var r=w/h,d=Math.min(Math.abs(r-.5625),Math.abs(r-.8));
return{light:clp(a.m<85?100-(85-a.m)*1.4:a.m>185?100-(a.m-185)*1.6:100),con:clp(a.sd/55*100),sharp:clp(100*Math.sqrt(a.lap/150)),res:clp(Math.min(w,h)/1080*100),fmt:clp(100-d*60)}}
var WT={light:.25,sharp:.3,con:.15,res:.15,fmt:.15},QK=["light","con","sharp","res","fmt"];
function total(f,fix){var s=0;for(var k in WT){var v=f[k];if(fix&&v<75)v=90;s+=v*WT[k]}return Math.round(s)}
function loadImg(f){return new Promise(function(res,rej){var i=new Image();i.onload=function(){try{res({s:[stat(i,i.naturalWidth,i.naturalHeight)],w:i.naturalWidth,h:i.naturalHeight,dur:0})}catch(e){rej(0)}};i.onerror=function(){rej(0)};i.src=URL.createObjectURL(f)})}
function loadVid(f){return new Promise(function(res,rej){var v=document.createElement("video"),o=[],ts=[],done=false,tm=setTimeout(function(){fail()},25000);
function fail(){if(!done){done=true;clearTimeout(tm);rej(0)}}
function fin(){if(!done){done=true;clearTimeout(tm);res({s:o,w:v.videoWidth,h:v.videoHeight,dur:v.duration})}}
function nx(){if(!ts.length)return fin();v.currentTime=ts.shift()}
v.muted=true;v.defaultMuted=true;v.setAttribute("playsinline","");v.setAttribute("muted","");v.preload="auto";v.style.cssText="position:fixed;left:-9999px;width:2px;height:2px";document.body.appendChild(v);
v.onloadeddata=function(){if(ts.length||o.length)return;var d=isFinite(v.duration)&&v.duration>0?v.duration:1;ts=[.1,.35,.6,.85].map(function(x){return Math.min(x*d,Math.max(0,d-.05))});nx()};
v.onseeked=function(){try{o.push(stat(v,v.videoWidth,v.videoHeight))}catch(e){return fail()}nx()};
v.onerror=fail;v.src=URL.createObjectURL(f);v.load()}).then(function(r){return r},function(e){throw e})}
function bar(l,a,b){return "<div class='small'>"+esc(l)+": "+a+" → "+b+"</div><div class='bw'><i style='width:"+a+"%'></i></div><div class='bw up' style='margin-top:-6px'><i style='width:"+b+"%'></i></div>"}
function li(a){return a.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")}
$("chk").onclick=async function(){
var out=$("qo"),f=$("fl").files[0],btn=this;
if(!f){out.innerHTML="<p>"+esc(t("pick"))+"</p>";return}
btn.disabled=true;out.innerHTML="<p>"+esc(t("checking"))+"</p>";
try{
var isV=f.type.indexOf("video")==0||/\.(mp4|mov|m4v|webm|3gp|mkv)$/i.test(f.name),r=isV?await loadVid(f):await loadImg(f);
if(!r.s.length||!r.w||!r.h)throw 0;
$("pv").innerHTML="";r.s.forEach(function(x){var i=new Image();i.src=x.th;i.alt="";$("pv").appendChild(i)});
var a={m:avg(r.s,"m"),sd:avg(r.s,"sd"),lap:avg(r.s,"lap")},fs=scoreOf(a,r.w,r.h),s=total(fs,false),af=Math.max(s,total(fs,true)),dl=af-s,lo=(1+dl/200).toFixed(2),hi=(1+dl/80).toFixed(2);
var pos=[],neg=[],fix=[];
QK.forEach(function(k){if(fs[k]>=75)pos.push(t("p_"+k))});
if(fs.light<60){neg.push(t(a.m<85?"n_dark":"n_bright"));fix.push(t(a.m<85?"f_dark":"f_bright"))}
if(fs.con<60){neg.push(t("n_con"));fix.push(t("f_con"))}
if(fs.sharp<60){neg.push(t("n_sharp"));fix.push(t("f_sharp"))}
if(fs.res<60){neg.push(t("n_res"));fix.push(t("f_res"))}
if(fs.fmt<60){neg.push(t("n_fmt"));fix.push(t("f_fmt"))}
if(isV&&(r.dur<5||r.dur>60)){neg.push(t(r.dur<5?"n_short":"n_long"));fix.push(t("f_len"))}
var vd=null;
if(AI_URL){try{var rs=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang:LN[L],biz:$("biz").value,type:$("type").value,goal:rv("goal"),isVideo:isV,w:r.w,h:r.h,dur:Math.round(r.dur||0),images:r.s.map(function(x){return x.bg})})});if(rs.ok){var aj=await rs.json();if(Array.isArray(aj.positives)&&Array.isArray(aj.negatives)&&Array.isArray(aj.fixes))vd=aj}}catch(e){}}
if(vd){pos=vd.positives.slice(0,5).map(String);neg=vd.negatives.slice(0,5).map(String);fix=vd.fixes.slice(0,5).map(String)}
var h="<div class='score'><div>"+esc(t("now"))+"<b>"+s+"</b>/100</div><div class='up'>"+esc(t("after"))+"<b>"+af+"</b>/100</div></div><p><b>"+esc(vd&&vd.verdict?String(vd.verdict):t(s>=75?"v_good":s>=55?"v_mid":"v_bad"))+"</b></p>";
h+="<div class='sec'><h3>"+esc(t("good"))+"</h3><ul class='pos'>"+li(pos.length?pos:[t("none")])+"</ul></div>";
h+="<div class='sec'><h3>"+esc(t("bad"))+"</h3><ul class='neg'>"+li(neg.length?neg:[t("none")])+"</ul></div>";
if(fix.length)h+="<div class='sec'><h3>"+esc(t("fix"))+"</h3><ol>"+li(fix)+"</ol></div>";
h+="<div class='sec'><h3>"+esc(t("reach"))+"</h3><div class='small'>"+esc(t("now"))+"</div><div class='bw'><i style='width:"+s+"%'></i></div><div class='small'>"+esc(t("after"))+"</div><div class='bw up'><i style='width:"+af+"%'></i></div><p class='small'>"+esc(t("reachNote").replace("{a}",lo).replace("{b}",hi))+"</p></div>";
h+="<div class='sec'><h3>"+esc(t("factors"))+"</h3>"+QK.map(function(k){return bar(t("q_"+k),fs[k],Math.max(fs[k],fs[k]<75?90:fs[k]))}).join("")+"<p class='small'>"+esc(t("qNote"))+"</p></div>";
out.innerHTML=h
}catch(e){out.innerHTML="<p class='warn'>"+esc(t("e_img"))+"</p>"}
btn.disabled=false};

if(BRAND)$("brandL").textContent=BRAND;else $("brandL").className="hide";
setLang("en");
</script>
